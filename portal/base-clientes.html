<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Base de Clientes | AÇO BRASIL</title>
<style>
/* Base de Clientes — Diretoria. Lê a base do EON (aba "base atualizada" do Painel Comercial DBA Marabá,
   atualizada todo sábado às 7h) e aplica as regras de carteira:
   1) escritório × cidade (130 com cliente em cidade de Belém e 159 com cliente em cidade de Marabá) → transferir
   2) dentro de Marabá, cliente numa rota de outra dupla → transferir para a dupla dona da rota
   3) base 051 (Regional NO): em Marabá e Parauapebas a oportunidade é de todos; nas outras cidades, da dupla da rota
   4) Belém: cliente com mais de 6 meses sem compra fica livre para qualquer vendedor */
:root{--marinho:#0b2a55;--azul2:#0b4a9a;--laranja:#f26b1d;--texto:#16202e;--cinza:#5b6675;--borda:#dfe5ec;--fundo:#f4f6fa;--ok:#1f9d55;--bad:#e2483d;--mid:#c88a00}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto);background:var(--fundo);font-size:15px}
.cab{background:linear-gradient(90deg,#071d3c,#0b2a55);color:#fff;position:sticky;top:0;z-index:20}
.cab-in{max-width:1400px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cab b{font-size:1.05rem}.cab small{opacity:.75;font-size:.78rem;display:block}
.fil{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem}
.btn{border:1px solid #ffffff55;color:#fff;background:transparent;border-radius:16px;padding:6px 14px;font:inherit;font-size:.8rem;cursor:pointer;text-decoration:none}
.btn:hover{background:#ffffff1a}.btn.cheio{background:var(--laranja);border-color:var(--laranja)}
.dot{width:8px;height:8px;border-radius:50%;background:#5bd16f;display:inline-block;margin-right:6px}
main{max-width:1400px;margin:0 auto;padding:22px 24px 60px}
.tit{border-left:4px solid var(--laranja);padding-left:16px;margin-bottom:18px}
.tit .sup{font-size:.72rem;letter-spacing:1.2px;font-weight:700;color:var(--cinza);text-transform:uppercase}
.tit h1{font-size:1.6rem;color:var(--marinho);line-height:1.2}.tit p{color:var(--cinza);font-size:.84rem}
.g{display:grid;gap:14px;margin-bottom:14px}.g5{grid-template-columns:repeat(5,1fr)}.g2{grid-template-columns:1fr 1fr}
.box{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:18px;min-width:0}
.box h2{font-size:.98rem;color:var(--marinho);margin-bottom:2px}.box .sub{font-size:.76rem;color:var(--cinza);margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:16px;position:relative;overflow:hidden;cursor:pointer;text-align:left;font:inherit}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--azul2))}
.kpi.on{outline:2px solid var(--c,var(--azul2))}
.kpi small{font-size:.7rem;font-weight:700;letter-spacing:.6px;color:var(--cinza);text-transform:uppercase}
.kpi b{display:block;font-size:1.6rem;color:var(--marinho);margin:4px 0 2px;line-height:1.1}
.kpi span{font-size:.78rem;color:var(--cinza)}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th{text-align:left;font-size:.68rem;letter-spacing:.5px;text-transform:uppercase;color:var(--cinza);padding:8px 6px;border-bottom:2px solid var(--borda);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid #edf1f6;white-space:nowrap}
td.q{white-space:normal;min-width:220px}
.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:800;color:var(--marinho);border-top:2px solid var(--borda)}
.rol{overflow-x:auto}
.barra{height:10px;background:#edf1f6;border-radius:4px;min-width:70px;position:relative;overflow:hidden}
.barra i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--azul2)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:700}
.tg-r{background:#fdecea;color:var(--bad)}.tg-a{background:#fff5df;color:#a77400}.tg-v{background:#e6f5ec;color:var(--ok)}.tg-c{background:#eef2f8;color:var(--marinho)}.tg-p{background:#f1eafa;color:#7a47aa}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ctl select,.ctl input[type=search]{font:inherit;font-size:.84rem;padding:7px 10px;border:1px solid var(--borda);border-radius:8px;background:#fff}
.ctl input[type=search]{min-width:220px;flex:1}
.ctl label{font-size:.8rem;color:var(--cinza);display:flex;gap:5px;align-items:center}
.bt2{font:inherit;font-size:.82rem;padding:7px 14px;border-radius:8px;border:1px solid var(--marinho);background:var(--marinho);color:#fff;cursor:pointer}
.bt2.cl{background:#fff;color:var(--marinho)}
.pag{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:.8rem;color:var(--cinza)}
.vazio{color:var(--cinza);font-size:.85rem;padding:20px;text-align:center}
.carga{display:flex;flex-direction:column;align-items:center;gap:12px;padding:80px 20px;color:var(--cinza)}
.spin{width:36px;height:36px;border:4px solid #dfe5ec;border-top-color:var(--laranja);border-radius:50%;animation:g 1s linear infinite}@keyframes g{to{transform:rotate(360deg)}}
.nota{font-size:.76rem;color:var(--cinza);margin-top:10px;line-height:1.5}
.regras{font-size:.82rem;line-height:1.6;color:var(--texto)}.regras li{margin-left:18px}
@media(max-width:1100px){.g5{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media(max-width:600px){main,.cab-in{padding-left:16px;padding-right:16px}.g5{grid-template-columns:1fr 1fr}.kpi b{font-size:1.25rem}.fil{margin-left:0}}
#gate{position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,#071d3c,#0b2a55);display:flex;align-items:center;justify-content:center;padding:20px}
#gate form{background:#fff;border-radius:14px;max-width:380px;width:100%;padding:30px 26px;box-shadow:0 20px 50px #0006}
#gate h1{font-size:1.3rem;color:var(--marinho);margin-bottom:4px}#gate p{font-size:.85rem;color:var(--cinza);margin-bottom:16px}
#gate label{display:block;font-size:.82rem;font-weight:600;margin:12px 0 4px}#gate input{width:100%;padding:11px 12px;border:1px solid var(--borda);border-radius:8px;font:inherit}
#gate button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:var(--marinho);color:#fff;font-weight:700;cursor:pointer}
#gate .er{color:#c0392b;font-size:.82rem;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<div id="gate"><form onsubmit="return entrarDir(event)"><h1>Base de Clientes</h1><p>Acesso restrito · Diretoria DBA Marabá e Belém</p>
<label for="gu">Usuário</label><input id="gu" autocomplete="username" required>
<label for="gs">Senha</label><input id="gs" type="password" autocomplete="current-password" required>
<button type="submit">Entrar</button><div class="er" id="ger"></div></form></div>
<script>
/* Mesmo login do Painel da Diretoria (só no navegador — não é segurança real). */
const DIR_USERS={"diretoria":"5df6b10b2a3358054b97e3bd42cc572e1e0244aeb2de0358379370c83d28e0b0","supervisao":"09be3223d2e141d52a73221eff0000bcede632177ca296489c349d3e8108e292"};
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function entrarDir(e){e.preventDefault();const u=gu.value.trim().toLowerCase();if(DIR_USERS[u]&&DIR_USERS[u]===await sha(gs.value)){try{sessionStorage.setItem("dir_ok","1")}catch(_){}gate.remove()}else ger.textContent="Usuário ou senha inválidos.";return false}
try{if(sessionStorage.getItem("dir_ok")==="1")gate.remove()}catch(_){}
</script>
<header class="cab"><div class="cab-in">
  <div><b>Base de Clientes · Diretoria</b><small id="stEl"><span class="dot"></span>carregando…</small></div>
  <div class="fil">
    <button class="btn cheio" onclick="baixar('tudo')">⬇ Baixar Excel (tudo)</button>
    <button class="btn" onclick="carregar()">Atualizar</button>
    <a class="btn" href="javascript:history.back()">← Voltar</a>
  </div>
</div></header>
<main id="app"><div class="carga"><div class="spin"></div>Lendo a base de clientes…</div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ---------- FONTES (planilhas publicadas na Web) ---------- */
const PUB_MAB="https://docs.google.com/spreadsheets/d/e/2PACX-1vRawbhvAjRq68EavM2MejbGZYjPLZDZ9-pmI3t56E3tgudNnnkcHGwYj6HAOFTZ0t-lfVBOQ1LGGK8H/pub?single=true&output=csv&gid=";
const PUB_BEL="https://docs.google.com/spreadsheets/d/e/2PACX-1vR48DjCVdLNMOQzoD-C_LGMecUY4Ypk2SNSxyc95hg5X9YRuGXIUbC9E5sQHu8DYvNM53jUShwU0PXA/pub?single=true&output=csv&gid=";
const FONTES={
  BASE: PUB_MAB+"1157486947", // Painel Marabá › "base atualizada" (EON: 051 + 130 + 159, atualizada sábado 7h)
  ROTAS:PUB_MAB+"1510073297", // Painel Marabá › "Rotas" (cidade → rota)
  CONTR:PUB_MAB+"1073423174", // Painel Marabá › "Cidades Contrato" (municípios do contrato de Marabá)
  DEPARA:PUB_BEL+"1146232883" // Painel Belém › "De-Para Cidades" (cidade → rota de Belém)
};
/* ---------- REGRAS (editar aqui quando mudar a divisão) ---------- */
// Dono de cada rota de Marabá. "Todos" = qualquer vendedor de Marabá pode atender.
const ROTA_DUPLA={
  "ROTA MARABA":"Todos","ROTA PARAUAPEBAS":"Todos","ROTA SÃO LUÍS":"Todos",
  "ROTA SÃO GERALDO":"Rafael / Martinho","ROTA CONCEIÇÃO":"Rafael / Martinho","ROTA CANAA":"Rafael / Martinho","ROTA SÃO FÉLIX DO XINGU":"Rafael / Martinho",
  "ROTA ANAPU":"Jadson / Rebeca","ROTA PARAGOMINAS":"Jadson / Rebeca","ROTA JACUNDA":"Jadson / Rebeca",
  "ROTA IMPERATRIZ":"Israel / Stefanny"
};
// Vendedor (proprietário da conta no EON) → dupla de Marabá
const VEND_DUPLA=[[/stefanny|israel/,"Israel / Stefanny"],[/rebeca|jadson/,"Jadson / Rebeca"],[/martinho|rafael (henrique|almeida)/,"Rafael / Martinho"],[/jessica bacelar|matheus/,"Jessica / Matheus"]];
const DIAS_LIVRE_BEL=180; // Belém: mais de 6 meses sem compra = livre para qualquer vendedor

/* ---------- utilitários ---------- */
function csv(t){const L=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=""}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);L.push(r);r=[];c=""}else c+=ch}if(c||r.length){r.push(c);L.push(r)}return L}
const N=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/^CENTRO\s*-\s*/i,"").replace(/\s+/g," ").trim().toUpperCase();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f0=v=>Math.round(v).toLocaleString("pt-BR");
const tit=s=>String(s||"").toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase());
const HOJE=new Date();
function dataBR(s){const p=String(s||"").split("/");return p.length==3?new Date(+p[2],+p[1]-1,+p[0]):null}

/* ---------- estado ---------- */
let C=[], LIDO=null, F={sit:"acao",dest:"",esc:"",q:"",emissor:true,ativos:true}, PAG=0;
const POR_PAG=200;
const SIT={
  TB:{t:"Transferir → DBA Belém",tg:"tg-r",g:"transf"},
  TM:{t:"Transferir → DBA Marabá",tg:"tg-r",g:"transf"},
  TR:{t:"Transferir → dupla da rota",tg:"tg-r",g:"transf"},
  DI:{t:"Distribuir → dupla da rota",tg:"tg-a",g:"distr"},
  O51:{t:"Oportunidade 051",tg:"tg-v",g:"op51"},
  LB:{t:"Livre Belém (6+ meses)",tg:"tg-p",g:"livre"},
  ZC:{t:"Zona compartilhada",tg:"tg-c",g:"info"},
  FO:{t:"Fora das áreas",tg:"tg-c",g:"info"},
  OK:{t:"Na carteira certa",tg:"tg-c",g:"ok"}
};

/* ---------- carga ---------- */
async function carregar(){
  stEl.innerHTML='<span class="dot"></span>atualizando…';
  try{
    const ft=u=>fetch(u+"&t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()});
    const [tb,tr,tc,td]=await Promise.all([ft(FONTES.BASE),ft(FONTES.ROTAS),ft(FONTES.CONTR),ft(FONTES.DEPARA).catch(()=>"")]);
    // Cidades da área de Marabá: Rotas + municípios do contrato
    const ROTA={},MAB=new Set(),BEL=new Set();
    csv(tr).slice(2).forEach(r=>{const c=N(r[0]);if(!c||!r[1])return;const ro=r[1].trim().toUpperCase();ROTA[c]={rota:tit(ro.replace(/^ROTA\s+/,"")),dupla:ROTA_DUPLA[ro]||r[2]||"Todos"};MAB.add(c)});
    csv(tc).forEach(r=>{if(/^\d+$/.test(r[1]||"")&&/^(MARAB|MARANH|TOCANTINS)/i.test(N(r[2]))&&r[3])MAB.add(N(r[3]))});
    // Cidades da área de Belém: De-Para (menos "Rota Fora")
    const ROTA_BEL={};if(td)csv(td).slice(2).forEach(r=>{const c=N(r[0]);if(c&&r[1]&&!/fora/i.test(r[1])){BEL.add(c);ROTA_BEL[c]=r[1].replace(/^Rota\s+/i,"")}});
    const L=csv(tb);const hi=L.findIndex(r=>r.some(c=>/^Nome$/i.test(c)));const H=L[hi].map(N);
    const ix=k=>H.indexOf(N(k));
    const I={esc:ix("Escritório de Vendas"),dono:ix("Proprietário da conta"),st:ix("Status da Conta"),rel:ix("Status de Relacionamento da Conta"),nome:ix("Nome"),cid:ix("Cidade"),uf:ix("UF"),cnpj:ix("CNPJ"),sap:ix("Código (SAP)"),ult:ix("Data da última compra"),abc:ix("Classe ABC"),seg:ix("Segmento"),tipo:ix("Tipo de Conta"),tel:ix("Telefone")};
    C=[];
    for(const r of L.slice(hi+1)){
      if(!r[I.nome]&&!r[I.sap])continue;
      const e=String(r[I.esc]||""),dono=String(r[I.dono]||"").trim(),cid=N(r[I.cid]);
      const escU=/051/.test(e)?"051":/130|Marab/i.test(e)?"MAB":/159|Bel/i.test(e)?"BEL":"?";
      const inM=MAB.has(cid),inB=BEL.has(cid);const reg=inM&&inB?"AMBAS":inM?"MAB":inB?"BEL":"FORA";
      const dn=N(dono).toLowerCase();let dDup="";
      if(escU!="BEL")for(const [re,d] of VEND_DUPLA)if(re.test(dn)){dDup=d;break}
      const papel=dDup?dDup:/gilvan/.test(dn)?"Gerência (Gilvan)":/integracao|^$/.test(dn)?"Sistema (sem vendedor)":"Outros";
      const ro=ROTA[cid]||null, rotaDup=ro?ro.dupla:(inM?"Todos":"");
      const ult=dataBR(r[I.ult]), dias=ult?Math.floor((HOJE-ult)/864e5):null;
      let s="OK",dest="",mot="";
      if(escU=="MAB"&&reg=="BEL"){s="TB";dest="DBA Belém";mot="Cidade da área de Belém ("+(ROTA_BEL[cid]||"")+") em escritório de Marabá"}
      else if(escU=="BEL"&&reg=="MAB"){s="TM";dest="DBA Marabá";mot="Cidade da área de Marabá"+(ro?" (Rota "+ro.rota+")":"")+" em escritório de Belém"}
      else if(escU=="MAB"&&(reg=="MAB"||reg=="AMBAS")&&rotaDup&&rotaDup!="Todos"){
        if(dDup&&dDup!=rotaDup){s="TR";dest=rotaDup;mot="Rota "+ro.rota+" é de "+rotaDup+", hoje com "+dDup}
        else if(!dDup){s="DI";dest=rotaDup;mot="Rota "+ro.rota+" · conta com "+papel}}
      else if(escU=="051"&&(reg=="MAB"||reg=="AMBAS")){s="O51";dest=rotaDup=="Todos"||!rotaDup?"Todos (Marabá)":rotaDup;mot=rotaDup=="Todos"||!rotaDup?(ro?"Rota "+ro.rota+": aberta para todos":"Cidade do contrato sem rota definida: aberta para todos"):"Rota "+ro.rota+" é de "+rotaDup}
      else if(escU=="BEL"&&reg=="BEL"&&dias!==null&&dias>DIAS_LIVRE_BEL){s="LB";dest="Qualquer vendedor (Belém)";mot=dias+" dias sem compra"}
      else if((escU=="MAB"||escU=="BEL")&&reg=="AMBAS"){s="ZC";mot="Cidade nas duas áreas (rotas de Marabá e Belém)"}
      else if(reg=="FORA"){s="FO";mot="Cidade fora das áreas de Marabá e Belém"}
      C.push({escU,esc:e,dono:tit(dono),papel:escU=="BEL"?tit(dono):papel,st:r[I.st]||"",rel:r[I.rel]||"",nome:r[I.nome]||"",cid:tit(r[I.cid]),uf:r[I.uf]||"",cnpj:r[I.cnpj]||"",sap:r[I.sap]||"",ult:r[I.ult]||"",dias,abc:r[I.abc]||"",seg:r[I.seg]||"",tipo:r[I.tipo]||"",tel:r[I.tel]||"",reg,rota:ro?ro.rota:(ROTA_BEL[cid]||""),s,dest,mot})}
    LIDO=new Date();render();
    stEl.innerHTML='<span class="dot"></span>'+f0(C.length)+' contas lidas do EON · lido às '+LIDO.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  }catch(e){stEl.textContent="erro ao ler a planilha";app.innerHTML=`<div class="box vazio">Não foi possível ler a base (${esc(e.message)}). Confira se o Painel Comercial DBA Marabá continua publicado na Web.</div>`}
}

/* ---------- filtros ---------- */
function universo(){return C.filter(c=>(!F.emissor||/emissor/i.test(c.tipo))&&(!F.ativos||!/cancelad/i.test(c.st)&&!/arquivad/i.test(c.rel)))}
function lista(){const q=N(F.q);return universo().filter(c=>{
  const g=SIT[c.s].g;
  if(F.sit=="acao"&&!["transf","distr","op51","livre"].includes(g))return false;
  if(F.sit&&F.sit!="acao"&&F.sit!="todos"&&c.s!=F.sit&&g!=F.sit)return false;
  if(F.dest&&c.dest!=F.dest)return false;
  if(F.esc&&c.escU!=F.esc)return false;
  if(q&&!N(c.nome+" "+c.cid+" "+c.sap+" "+c.cnpj+" "+c.dono).includes(q))return false;
  return true})}

/* ---------- tela ---------- */
function kpi(k,lbl,v,sub,cor){return `<button class="kpi${F.sit==k?" on":""}" style="--c:${cor}" onclick="F.sit='${k}';F.dest='';PAG=0;render()"><small>${lbl}</small><b>${f0(v)}</b><span>${sub}</span></button>`}
function render(){
  const U=universo(),cnt=g=>U.filter(c=>SIT[c.s].g==g).length,cs=s=>U.filter(c=>c.s==s).length;
  const porEsc={MAB:U.filter(c=>c.escU=="MAB").length,BEL:U.filter(c=>c.escU=="BEL").length,"051":U.filter(c=>c.escU=="051").length};
  // matriz de transferência e oportunidades por destino
  const grp=(arr,k)=>{const o={};arr.forEach(c=>{o[c[k]]=(o[c[k]]||0)+1});return Object.entries(o).sort((a,b)=>b[1]-a[1])};
  const tr=U.filter(c=>SIT[c.s].g=="transf"||SIT[c.s].g=="distr");
  const mat={};tr.forEach(c=>{const de=c.escU=="BEL"?"DBA Belém · "+c.dono:c.papel;const k=de+"→"+c.dest;mat[k]=mat[k]||{de,para:c.dest,n:0,abc:0};mat[k].n++;if(/^[AB]$/.test(c.abc))mat[k].abc++});
  const matL=Object.values(mat).sort((a,b)=>b.n-a.n).slice(0,25);
  const op=grp(U.filter(c=>c.s=="O51"),"dest");const opMax=Math.max(1,...op.map(x=>x[1]));
  const L=lista(),pg=Math.max(1,Math.ceil(L.length/POR_PAG));if(PAG>=pg)PAG=0;const vis=L.slice(PAG*POR_PAG,(PAG+1)*POR_PAG);
  const dests=[...new Set(U.filter(c=>c.dest).map(c=>c.dest))].sort();
  app.innerHTML=`
  <div class="tit"><div class="sup">Carteira · EON (051 + 130 + 159)</div><h1>Base de Clientes</h1><p>${f0(U.length)} contas no recorte · Marabá ${f0(porEsc.MAB)} · Belém ${f0(porEsc.BEL)} · Regional NO (051) ${f0(porEsc["051"])} · base do EON atualizada todo sábado às 7h</p></div>
  <div class="g g5">
   ${kpi("transf","A transferir",cnt("transf"),`${f0(cs("TB"))} p/ Belém · ${f0(cs("TM"))} p/ Marabá · ${f0(cs("TR"))} entre duplas`,"var(--bad)")}
   ${kpi("distr","A distribuir",cnt("distr"),"contas da gerência/sistema numa rota com dono","var(--mid)")}
   ${kpi("op51","Oportunidades 051",cnt("op51"),"clientes da base direta na área de Marabá","var(--ok)")}
   ${kpi("livre","Livres em Belém",cnt("livre"),"mais de 6 meses sem compra","#7a47aa")}
   ${kpi("todos","Todas as contas",U.length,`${f0(cnt("ok"))} na carteira certa · ${f0(cnt("info"))} fora/compartilhada`,"var(--azul2)")}
  </div>
  <div class="g g2">
   <div class="box"><h2>Quem transfere para quem</h2><div class="sub">Transferências e distribuições · coluna A/B = clientes classe A ou B</div><div class="rol"><table><thead><tr><th>Hoje com</th><th>Vai para</th><th class="n">Clientes</th><th class="n">A/B</th></tr></thead><tbody>
    ${matL.map(m=>`<tr style="cursor:pointer" onclick="F.sit='${m.para=="DBA Belém"?"TB":m.para=="DBA Marabá"?"TM":"acao"}';F.dest='${esc(m.para)}';F.q='';PAG=0;render();lst.scrollIntoView({behavior:'smooth'})"><td>${esc(m.de)}</td><td><b>${esc(m.para)}</b></td><td class="n"><b>${f0(m.n)}</b></td><td class="n">${m.abc?f0(m.abc):"–"}</td></tr>`).join("")||'<tr><td colspan="4" class="vazio">Nada a transferir</td></tr>'}
    </tbody></table></div></div>
   <div class="box"><h2>Oportunidades da base 051 por dupla</h2><div class="sub">Marabá e Parauapebas: abertas a todos · demais cidades: dupla dona da rota</div>
    ${op.map(([d,n])=>`<div style="display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;font-size:.82rem;margin-bottom:9px;cursor:pointer" onclick="F.sit='O51';F.dest='${esc(d)}';PAG=0;render();lst.scrollIntoView({behavior:'smooth'})"><span>${esc(d)}</span><div class="barra"><i style="width:${n/opMax*100}%;background:var(--ok)"></i></div><b class="n" style="color:var(--marinho)">${f0(n)}</b></div>`).join("")||'<div class="vazio">Nenhuma oportunidade 051 no recorte</div>'}
    <div class="nota"><b>Regras aplicadas:</b><ul class="regras"><li>130 com cliente em cidade de Belém, ou 159 em cidade de Marabá → transferir de escritório.</li><li>Dentro de Marabá, cliente em rota de outra dupla → transferir para a dupla da rota.</li><li>São Geraldo, Conceição, Canaã e São Félix: Rafael/Martinho · Anapu, Paragominas e Jacundá: Jadson/Rebeca · Imperatriz: Israel/Stefanny.</li><li>Belém: cliente com mais de 6 meses sem compra é livre para qualquer vendedor.</li></ul></div></div>
  </div>
  <div class="box" id="lst"><h2>Lista de clientes</h2><div class="sub">${f0(L.length)} clientes com esses filtros · clique em "Baixar Excel" para levar a lista</div>
   <div class="ctl">
    <select onchange="F.sit=this.value;F.dest='';PAG=0;render()">${[["acao","Só o que pede ação"],["transf","A transferir (todos)"],["TB","→ DBA Belém"],["TM","→ DBA Marabá"],["TR","→ dupla da rota"],["distr","A distribuir"],["op51","Oportunidades 051"],["livre","Livres em Belém"],["ZC","Zona compartilhada"],["FO","Fora das áreas"],["ok","Na carteira certa"],["todos","Todas as contas"]].map(([v,t])=>`<option value="${v}"${F.sit==v?" selected":""}>${t}</option>`).join("")}</select>
    <select onchange="F.dest=this.value;PAG=0;render()"><option value="">Qualquer destino</option>${dests.map(d=>`<option${F.dest==d?" selected":""}>${esc(d)}</option>`).join("")}</select>
    <select onchange="F.esc=this.value;PAG=0;render()">${[["","Todos os escritórios"],["MAB","DBA Marabá (130)"],["BEL","DBA Belém (159)"],["051","Regional NO (051)"]].map(([v,t])=>`<option value="${v}"${F.esc==v?" selected":""}>${t}</option>`).join("")}</select>
    <input type="search" placeholder="Buscar cliente, cidade, SAP, CNPJ ou vendedor" value="${esc(F.q)}" onchange="F.q=this.value;PAG=0;render()">
    <label><input type="checkbox" ${F.emissor?"checked":""} onchange="F.emissor=this.checked;PAG=0;render()">só emissores da ordem</label>
    <label><input type="checkbox" ${F.ativos?"checked":""} onchange="F.ativos=this.checked;PAG=0;render()">sem cancelados/arquivados</label>
    <button class="bt2" onclick="baixar('filtro')">⬇ Baixar Excel</button>
   </div>
   <div class="rol"><table><thead><tr><th>Situação</th><th>Cliente</th><th>Cidade</th><th>Escritório</th><th>Proprietário</th><th>Vai para</th><th>Motivo</th><th class="n">Última compra</th><th>ABC</th><th>Relacionamento</th><th>SAP</th></tr></thead><tbody>
    ${vis.map(c=>`<tr><td><span class="tag ${SIT[c.s].tg}">${esc(SIT[c.s].t)}</span></td><td class="q"><b>${esc(c.nome)}</b></td><td>${esc(c.cid)}/${esc(c.uf)}</td><td>${esc(c.esc)}</td><td>${esc(c.dono)}</td><td><b>${esc(c.dest)}</b></td><td class="q">${esc(c.mot)}</td><td class="n">${esc(c.ult)||"–"}</td><td>${esc(c.abc)}</td><td>${esc(c.rel)}</td><td>${esc(c.sap)}</td></tr>`).join("")||'<tr><td colspan="11" class="vazio">Nenhum cliente com esses filtros</td></tr>'}
   </tbody></table></div>
   ${pg>1?`<div class="pag">Página ${PAG+1} de ${pg} <button class="bt2 cl" onclick="PAG=Math.max(0,PAG-1);render()">‹</button><button class="bt2 cl" onclick="PAG=Math.min(${pg-1},PAG+1);render()">›</button></div>`:""}
  </div>`;
}

/* ---------- Excel ---------- */
function linhaX(c){return{"Situação":SIT[c.s].t,"Vai para":c.dest,"Motivo":c.mot,"Cliente":c.nome,"Código SAP":c.sap,"CNPJ":c.cnpj,"Cidade":c.cid,"UF":c.uf,"Rota":c.rota,"Escritório":c.esc,"Proprietário":c.dono,"Status da conta":c.st,"Relacionamento":c.rel,"Última compra":c.ult,"Dias sem compra":c.dias??"","Classe ABC":c.abc,"Segmento":c.seg,"Tipo de conta":c.tipo,"Telefone":c.tel}}
function aba(wb,nome,arr){const ws=XLSX.utils.json_to_sheet(arr.map(linhaX));ws["!cols"]=[22,24,48,40,12,16,22,5,18,22,26,12,24,12,10,8,22,20,16].map(w=>({wch:w}));ws["!autofilter"]={ref:ws["!ref"]};XLSX.utils.book_append_sheet(wb,ws,nome.slice(0,31))}
function baixar(modo){
  if(typeof XLSX=="undefined"){alert("A biblioteca do Excel não carregou. Atualize a página e tente de novo.");return}
  if(!C.length)return;
  const wb=XLSX.utils.book_new(),U=universo(),d=new Date().toISOString().slice(0,10);
  if(modo=="filtro"){aba(wb,"Clientes",lista());XLSX.writeFile(wb,`Base Clientes - filtro - ${d}.xlsx`);return}
  const res=Object.entries(SIT).map(([k,v])=>({"Situação":v.t,"Clientes":U.filter(c=>c.s==k).length}));
  const wr=XLSX.utils.json_to_sheet(res);wr["!cols"]=[{wch:30},{wch:10}];XLSX.utils.book_append_sheet(wb,wr,"Resumo");
  aba(wb,"A transferir",U.filter(c=>SIT[c.s].g=="transf"));
  aba(wb,"A distribuir",U.filter(c=>c.s=="DI"));
  aba(wb,"Oportunidades 051",U.filter(c=>c.s=="O51"));
  aba(wb,"Livres Belém",U.filter(c=>c.s=="LB"));
  aba(wb,"Todas as contas",C);
  XLSX.writeFile(wb,`Base Clientes - Diretoria - ${d}.xlsx`);
}
carregar();
</script>
