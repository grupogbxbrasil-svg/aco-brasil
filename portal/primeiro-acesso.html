<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Criar senha – Aço Brasil</title>
<link rel="stylesheet" href="../assets/css/site.css">
<style>
body{background:linear-gradient(135deg,#071d3c,#0b2a55);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:12px;max-width:420px;width:100%;padding:32px 28px;box-shadow:0 20px 50px #0006}
.box img{height:40px;margin-bottom:18px}
.box h1{font-size:1.4rem;color:var(--marinho)}
.box p{color:var(--cinza);font-size:.9rem;margin:8px 0 18px}
label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid var(--borda);border-radius:8px;font:inherit;background:#f6f8fb}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:var(--marinho);color:#fff;font-weight:700;font-size:.95rem;cursor:pointer}
button:disabled{opacity:.6}
#erro{color:#c0392b;font-size:.85rem;min-height:18px;margin-top:10px}
</style>
</head>
<body>
<main class="box">
  <img src="../logo-arcelormittal.png" alt="ArcelorMittal">
  <h1>Criar sua senha</h1>
  <p>Escolha uma senha com pelo menos 8 caracteres. Ela é só sua: ninguém da empresa tem acesso a ela.</p>
  <form id="f">
    <label for="s1">Nova senha</label>
    <input id="s1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="s2">Repita a senha</label>
    <input id="s2" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">Salvar e entrar</button>
    <div id="erro"></div>
  </form>
</main>
<script>
const token=location.hash.slice(1);
history.replaceState(null,"",location.pathname); // tira o token da barra de endereço
if(!/^[0-9a-f]{48}$/.test(token)){erro.textContent="Link inválido. Peça um novo ao administrador.";f.querySelector("button").disabled=true}
f.onsubmit=async e=>{e.preventDefault();erro.textContent="";
 if(s1.value!==s2.value){erro.textContent="As senhas não conferem.";return}
 const b=f.querySelector("button");b.disabled=true;
 try{const r=await fetch("/api/primeiro-acesso",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token,senha:s1.value})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){erro.textContent=d.erro||"Não foi possível salvar.";b.disabled=false;return}
  location.href="login.html";
 }catch(_){erro.textContent="Sem conexão com o servidor.";b.disabled=false}};
</script>
</body>
</html>
