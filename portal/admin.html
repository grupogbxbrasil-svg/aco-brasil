<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Usuários do portal – Aço Brasil</title>
<link rel="stylesheet" href="../assets/css/site.css">
<style>
body{background:#f3f6fa;margin:0}
.cab{background:var(--marinho);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cab b{font-size:1.05rem}.cab a,.cab button{color:#fff;background:#ffffff1f;border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;text-decoration:none}
main{max-width:1100px;margin:0 auto;padding:20px 16px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px #0b2a5512;margin-bottom:18px}
h2{font-size:1.1rem;color:var(--marinho);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
label{font-size:.78rem;font-weight:600;display:block;margin-bottom:4px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--borda);border-radius:8px;font:inherit;background:#f6f8fb;box-sizing:border-box}
.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--marinho);color:#fff;font-weight:700;cursor:pointer;font:inherit}
.btn.sec{background:#e8edf4;color:var(--marinho)}.btn.per{background:#fdecea;color:#b0321f}
.tab{width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #e6ebf2;white-space:nowrap}th{font-size:.75rem;color:var(--cinza);text-transform:uppercase}
.st{font-size:.75rem;padding:2px 8px;border-radius:20px;background:#e8f5ec;color:#1e7a3c}.st.pend{background:#fff4dc;color:#8a5a00}.st.off{background:#eee;color:#777}
td .btn{padding:6px 10px;font-size:.8rem}
#msg{margin-top:12px;font-size:.88rem}
.link{background:#eef4ff;border:1px solid #c9daf8;border-radius:8px;padding:12px;margin-top:12px;font-size:.85rem;word-break:break-all}
.link b{display:block;margin-bottom:6px}
</style>
</head>
<body>
<header class="cab"><b>Usuários do portal</b><div><a href="diretoria.html">Painel da Diretoria</a> <button onclick="sair()">Sair</button></div></header>
<main>
  <section class="card">
    <h2>Novo usuário</h2>
    <form id="novo" class="grid">
      <div><label for="nNome">Nome</label><input id="nNome" required maxlength="80"></div>
      <div><label for="nUsuario">Usuário (login)</label><input id="nUsuario" required pattern="[a-z0-9._\-]{2,40}" placeholder="ex.: israel"></div>
      <div><label for="nPerfil">Perfil</label><select id="nPerfil"></select></div>
      <div><label for="nDupla">Dupla (vendedor)</label><select id="nDupla"><option value="">—</option></select></div>
      <div><label for="nUnidade">Unidade</label><select id="nUnidade"><option value="">—</option><option>DBA Marabá</option><option>DBA Belém</option></select></div>
      <div><button class="btn" type="submit">Cadastrar</button></div>
    </form>
    <div id="msg"></div>
  </section>
  <section class="card">
    <h2>Usuários cadastrados</h2>
    <div class="tab"><table><thead><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Dupla</th><th>Unidade</th><th>Situação</th><th></th></tr></thead><tbody id="lista"><tr><td colspan="7">Carregando…</td></tr></tbody></table></div>
  </section>
</main>
<script src="duplas.js"></script>
<script>
const PERFIS={admin:"Administrador",diretoria:"Diretoria",supervisao:"Supervisão",logistica:"Logística",vendedor:"Vendedor"};
nPerfil.innerHTML=Object.entries(PERFIS).map(([k,v])=>`<option value="${k}"${k==="vendedor"?" selected":""}>${v}</option>`).join("");
nDupla.innerHTML+=Object.entries(DUPLAS).filter(([id])=>!/fulano/.test(id)).map(([id,d])=>`<option value="${id}">${esc(d.nomes.join(" & "))} · ${esc(d.unidade)}</option>`).join("");
nDupla.onchange=()=>{const d=DUPLAS[nDupla.value];if(d)nUnidade.value=d.unidade};
function esc(t){return String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(metodo,corpo,qs=""){const r=await fetch("/api/admin/usuarios"+qs,{method:metodo,headers:corpo?{"content-type":"application/json"}:{},body:corpo?JSON.stringify(corpo):undefined});
 const d=await r.json().catch(()=>({}));if(r.status===401)location.href="login.html";if(!r.ok)throw new Error(d.erro||"Erro "+r.status);return d}
function mostrarLink(nome,link){msg.innerHTML=`<div class="link"><b>Link de acesso de ${esc(nome)} (vale 7 dias, uso único):</b><span id="lk">${esc(link)}</span><br><br><button class="btn sec" onclick="navigator.clipboard.writeText(document.getElementById('lk').textContent);this.textContent='Copiado!'">Copiar link</button> Envie por WhatsApp ou e-mail. A pessoa cria a própria senha.</div>`}
async function carregar(){try{const us=await api("GET");
 lista.innerHTML=us.map((u,i)=>{const st=!u.ativo?'<span class="st off">Desativado</span>':u.tem_senha?'<span class="st">Ativo</span>':'<span class="st pend">Aguardando 1º acesso</span>';
  const dupla=u.dupla&&DUPLAS[u.dupla]?DUPLAS[u.dupla].nomes.join(" & "):(u.dupla||"—");
  return `<tr><td>${esc(u.nome)}</td><td>${esc(u.usuario)}</td><td>${esc(PERFIS[u.perfil]||u.perfil)}</td><td>${esc(dupla)}</td><td>${esc(u.unidade||"—")}</td><td>${st}</td>
  <td><button class="btn sec" onclick="redefinir(${i})">Novo link de senha</button>
  <button class="btn sec" onclick="ativo(${i})">${u.ativo?"Desativar":"Reativar"}</button>
  <button class="btn per" onclick="excluir(${i})">Excluir</button></td></tr>`}).join("")||'<tr><td colspan="7">Nenhum usuário.</td></tr>';
 window._us=us}catch(e){lista.innerHTML=`<tr><td colspan="7">${esc(e.message)}</td></tr>`}}
novo.onsubmit=async e=>{e.preventDefault();msg.textContent="";
 try{const d=await api("POST",{nome:nNome.value,usuario:nUsuario.value.trim().toLowerCase(),perfil:nPerfil.value,dupla:nDupla.value,unidade:nUnidade.value});
  mostrarLink(nNome.value,d.link);novo.reset();nPerfil.value="vendedor";carregar()}catch(er){msg.textContent=er.message}};
async function redefinir(i){const u=_us[i].usuario,nome=_us[i].nome;if(!confirm("Gerar novo link de senha para "+nome+"? A senha atual deixa de valer."))return;
 try{const d=await api("PATCH",{usuario:u,redefinir:true});mostrarLink(nome,d.link);scrollTo(0,0)}catch(e){alert(e.message)}}
async function ativo(i){const x=_us[i];try{await api("PATCH",{usuario:x.usuario,ativo:!x.ativo,dupla:x.dupla,unidade:x.unidade});carregar()}catch(e){alert(e.message)}}
async function excluir(i){const u=_us[i].usuario;if(!confirm("Excluir o usuário "+u+"? Isso não pode ser desfeito."))return;try{await api("DELETE",null,"?usuario="+encodeURIComponent(u));carregar()}catch(e){alert(e.message)}}
async function sair(){try{await fetch("/api/logout",{method:"POST"})}catch(_){}location.href="login.html"}
carregar();
</script>
</body>
</html>
