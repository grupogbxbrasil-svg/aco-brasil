<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Acesso Restrito – Aço Brasil</title>
<link rel="stylesheet" href="../assets/css/site.css">
<style>
body{background:linear-gradient(135deg,#071d3c,#0b2a55);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:12px;max-width:420px;width:100%;padding:32px 28px;box-shadow:0 20px 50px #0006}
.box img{height:40px;margin-bottom:18px}
.box h1{font-size:1.4rem;color:var(--marinho)}
.box p{color:var(--cinza);font-size:.9rem;margin:8px 0 18px}
.aviso{background:#fff7e6;border:1px solid #f2c26b;border-radius:8px;padding:12px 14px;font-size:.85rem;color:#6b4a00}
label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid var(--borda);border-radius:8px;font:inherit;background:#f6f8fb}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:var(--marinho);color:#fff;font-weight:700;font-size:.95rem;cursor:pointer}
.voltar{display:block;text-align:center;margin-top:16px;font-size:.85rem}
</style>
</head>
<body>
<main class="box">
  <img src="../logo-arcelormittal.png" alt="ArcelorMittal">
  <h1>Acesso Restrito</h1>
  <p>Portal interno para Vendedores, Gerência e Diretoria da Aço Brasil.</p>
  <div class="aviso" role="status"><b>Ambiente de teste.</b> Entre com o usuário da sua dupla.</div>
  <form onsubmit="entrar(event)">
    <label for="email">Usuário</label>
    <input id="email" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
<div id="erro" style="color:#c0392b;font-size:.85rem;min-height:18px;margin-top:10px"></div>
  </form>
  <a class="voltar" href="../index.html">← Voltar ao site</a>
</main>
<script src="duplas.js"></script>
<script>
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function entrar(e){e.preventDefault();
 const k=email.value.trim().toLowerCase(),p=senha.value;
 if(k==="diretoria"){if(await sha(p)==="5df6b10b2a3358054b97e3bd42cc572e1e0244aeb2de0358379370c83d28e0b0"){try{sessionStorage.setItem("dir_ok","1")}catch(_){}location.href="diretoria.html";return}else{erro.textContent="Usuário ou senha inválidos.";return}}
 for(const[id,d]of Object.entries(DUPLAS)){if(d.usuarios[k]===p){try{sessionStorage.setItem("vend_"+id,k)}catch(_){}location.href="painel.html?d="+id;return}}
 erro.textContent="Usuário ou senha inválidos.";}
</script>
</body>
</html>
