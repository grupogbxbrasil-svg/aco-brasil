<style>

<header class="cab"><div class="cab-in">

  <div class="fil">
    <div class="uni" role="group" aria-label="Unidade"><button class="btn on" data-u="mab">Marabá</button><button class="btn" data-u="bel">Belém</button><button class="btn" data-u="out" title="Clientes de cidades fora das praças de Marabá e de Belém">Outras praças</button></div>
    <button class="btn" onclick="carregar()">Atualizar</button>
    <a class="btn" href="#" onclick="parent.postMessage({tipo:'sair'},'*');return false">Sair</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* Créditos dos clientes — ALPE, AMCARD, Seguro Arcelor e Crédito DBA (risco SAP), uma base por unidade (Marabá e Belém têm planilhas separadas).
   O Financeiro (Filipe) envia as planilhas; vendedores e duplas veem só a própria carteira. Dados: backend/creditos.web.js no Wix. */
let IGN=[];const TIPOS=[{k:"alpe",n:"ALPE",c:"#0b4a9a"},{k:"amcard",n:"AMCARD",c:"#1f9d55"},{k:"seguro",n:"Seguro Arcelor",c:"#f26b1d"},{k:"dba",n:"Crédito DBA (risco)",c:"#7a47aa"}];
const ABAS=[["resumo","Resumo"],["ranking","Ranking"],["alpe","ALPE"],["amcard","AMCARD"],["seguro","Seguro Arcelor"],["dba","Crédito DBA (risco)"]];
const UNOME={mab:"Marabá",bel:"Belém",out:"Outras praças"};const UNIS=["mab","bel","out"];let PR=null;
let DONOS={},ABA="resumo",UNI="mab",CTX={modo:"vendedor",nome:""},DADOS={metas:{},bases:{}},ENV={},FIL="",Q="",ROWS=[];
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const so=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const dig=s=>String(s??"").replace(/\D/g,"");
const titulo=s=>String(s||"").toLowerCase().replace(/(^|[\s\/.-])\S/g,m=>m.toUpperCase()).replace(/\b(Ltda|Sa|S\/A|Me|Epp|Eireli)\b/gi,m=>m.toUpperCase());
const R=v=>v==null||v===""?"–":Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const P=v=>v==null||v===""||Math.abs(v)>1000?"–":Number(v).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%";
const dt=iso=>{if(!iso)return"–";const d=new Date(iso);return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};
const sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
const tit=(sup,h,p)=>`<div class="tit"><div class="sup">${sup}</div><h1>${h}</h1>${p?`<p>${p}</p>`:""}</div>`;
const kpi=(t,v,sub,c)=>`<div class="kpi" style="--c:${c||"var(--azul2)"}"><small>${t}</small><b>${v}</b><span>${sub||""}</span></div>`;
function num(v){if(typeof v=="number")return v;let s=String(v??"").replace(/[R$\s%]/g,"");if(!s)return null;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=parseFloat(s);return isNaN(n)?null:n}
function doc(v){let d=dig(v);if(!d)return"";if(d.length>11)return d.padStart(14,"0");return d.length>=9?d.padStart(11,"0"):d}
function fmtDoc(d){return d.length==14?d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,"$1.$2.$3/$4-$5"):d.length==11?d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,"$1.$2.$3-$4"):d}
const chave=k=>k+"_"+UNI, base=k=>DADOS.bases[chave(k)]||[], meta=k=>DADOS.metas[chave(k)];

/* ---------- comunicação com a página do Wix ---------- */
let SEQ=0;const PEND={};
function rpc(fn,...args){return new Promise((ok,no)=>{const id="r"+(++SEQ);PEND[id]={ok,no};parent.postMessage({tipo:"rpc",id,fn,args},"*")})}
addEventListener("message",e=>{const d=e.data||{};
  if(d.tipo=="ctx"){CTX=d;if(d.uni){UNI=d.uni;document.querySelector(".uni").style.display="none"}setUni(UNI);carregar();return}
  if(d.tipo=="rpcr"&&PEND[d.id]){const p=PEND[d.id];delete PEND[d.id];d.erro?p.no(new Error(d.erro)):p.ok(d.r)}});

const MAPA={
 alpe:{req:["cnpj","limite atribuido","limite disponivel"],c:{fil:"filial",cnpj:"cnpj",nome:"razao social",lim:"limite atribuido",disp:"limite disponivel",cid:"cidade",uf:"uf",vend:"vendedor alpe"}},
 amcard:{req:["cnpj","$ limite de compra","$ limite de compra disponivel"],c:{cnpj:"cnpj",nome:"nome cliente",tp:"tipo de pessoa",uf:"uf",cid:"cidade",und:"unidade",cri:"dt. criacao",ult:"dt. da ultima transacao",lim:"$ limite de compra",disp:"$ limite de compra disponivel",tom:"$ limite de compra tomado"}},
 seguro:{req:["cnpj","limite de credito","exposicao total"],c:{parc:"parceiro de negocios",cnpj:"cnpj",cid:"cidade",nome:"nome 1",cls:"classe de risco",lim:"limite de credito",exp:"exposicao total",pct:"percentual esgotamento",dias:"dias em atraso",atr:"valor em atraso",seg:"seguro de credito",grp:"grp.responsaveis"}},
 dba:{req:["parceiro de negocios","limite de credito","exposicao total","grp.responsaveis"],c:{parc:"parceiro de negocios",cnpj:"cnpj",cpf:"cpf",cid:"cidade",nome:"nome 1",cls:"classe de risco",lim:"limite de credito",val:"validade do limite",exp:"exposicao total",pct:"percentual esgotamento",ov:"ordem de vendas",ovp:"ordem de vendas pendente liberacao",rem:"remessas",cr:"contas a receber",dias:"dias em atraso",atr:"valor em atraso",venc:"vencto mais antigo",dso:"dso",grp:"grp.responsaveis",regra:"regra verif.credito",bloq:"bloq.sap credit management",mot:"motivo p/bloqueio sap credit management"}}};
const NUMS=["lim","disp","tom","exp","pct","dias","atr","seg","ov","ovp","rem","cr","dso"],DATAS=["val","venc"];
/* data do Excel (número de série ou texto) -> dd/mm/aaaa; validade 2100/9999 = sem vencimento */
function xd(v){if(v===""||v==null)return"";let d=null;if(typeof v=="number")d=new Date(Math.round((v-25569)*864e5));else if(v instanceof Date)d=v;else{const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)d=new Date(Date.UTC(+m[1],m[2]-1,+m[3]));else return String(v).trim()}if(isNaN(d))return"";if(d.getUTCFullYear()>=2100)return"sem vencimento";return String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0")+"/"+d.getUTCFullYear()}
function lerPlanilha(tipo,buf){
  const wb=XLSX.read(buf,{type:"array"}),M=MAPA[tipo],out=[];let abas=0;IGN=[];
  wb.SheetNames.forEach(sn=>{const L=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:""});
    const hi=L.findIndex(r=>{const h=r.map(so);return M.req.every(k=>h.includes(k))});if(hi<0){if(L.filter(r=>r.some(v=>v!==""&&v!=null)).length>1)IGN.push(sn);return}abas++;
    const H=L[hi].map(so),ix={};for(const [k,n] of Object.entries(M.c))ix[k]=H.indexOf(n);
    L.slice(hi+1).forEach(r=>{const o={};for(const [k,i] of Object.entries(ix)){if(i<0)continue;let v=r[i];v=NUMS.includes(k)?num(v):DATAS.includes(k)?xd(v):String(v??"").trim();if(v!==""&&v!=null)o[k]=v}
      o.cnpj=doc(r[ix.cnpj])||(ix.cpf>=0?doc(r[ix.cpf]):"");delete o.cpf;if(!o.cnpj)return;
      /* risco DBA: só clientes com limite, exposição, atraso ou bloqueio (a exportação traz todo o cadastro) */
      if(tipo=="dba"&&!((o.lim||0)>0||(o.exp||0)>0||(o.atr||0)>0||o.bloq))return;if(tipo=="alpe"&&!o.fil)o.fil=sn;o.aba=sn;out.push(o)})});
  if(!abas)throw new Error("Não reconheci o modelo "+TIPOS.find(t=>t.k==tipo).n+". Confira se é a planilha certa (colunas: "+M.req.join(", ")+").");
  return out}

/* ---------- separação por praça (cidade) ---------- */
const cidN=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/^CENTRO\s*-\s*/i,"").replace(/\s+/g," ").trim().toUpperCase();
async function pracas(){if(PR)return PR;const r=await rpc("pracas");if(!r||!r.ok)throw new Error((r&&r.erro)||"não consegui ler as praças");PR={mab:new Set(r.mab),bel:new Set(r.bel)};return PR}
/* unidade pelo Grp. responsáveis (DMB/DBE) ou pelo nome da aba (Marabá/Belém); só sem isso vai pela cidade */
function uniFixa(x){if(/^DBE$|^159/i.test(x.grp||""))return"bel";if(/^DMB$|^130/i.test(x.grp||""))return"mab";if(/bel/i.test(cidN(x.aba)))return"bel";if(/marab/i.test(cidN(x.aba)))return"mab";return""}
function unidades(k,x){const f=uniFixa(x);if(f)return[f];if(k=="alpe"&&x.fil){if(/bel/i.test(x.fil))return["bel"];if(/marab/i.test(x.fil))return["mab"]}
  const c=cidN(x.cid),m=PR.mab.has(c),b=PR.bel.has(c);return m&&b?["mab","bel"]:m?["mab"]:b?["bel"]:["out"]}
function uniDBA(x){return uniFixa(x)||UNI}
function separar(k,L){const o={mab:[],bel:[],out:[]};if(k=="dba"){L.forEach(x=>o[uniDBA(x)].push(x));return o}L.forEach(x=>unidades(k,x).forEach(u=>o[u].push(x)));return o}

/* ---------- visão por cliente ---------- */
function juntar(){const M=new Map(),pega=d=>{if(!M.has(d))M.set(d,{cnpj:d,nome:"",cid:"",uf:"",alpe:[],am:null,seg:null,dba:null});return M.get(d)};
  base("alpe").forEach(x=>{const c=pega(x.cnpj);c.alpe.push(x);c.nome=c.nome||x.nome;c.cid=c.cid||x.cid;c.uf=c.uf||x.uf});
  base("amcard").forEach(x=>{const c=pega(x.cnpj);c.am=x;c.nome=c.nome||x.nome;c.cid=c.cid||x.cid;c.uf=c.uf||x.uf});
  base("seguro").forEach(x=>{const c=pega(x.cnpj);c.seg=x;c.nome=x.nome||c.nome;c.cid=c.cid||x.cid});
  base("dba").forEach(x=>{const c=pega(x.cnpj);c.dba=x;c.nome=c.nome||x.nome;c.cid=c.cid||x.cid});
  return [...M.values()].map(c=>{c.alim=sum(c.alpe,x=>x.lim);c.adisp=sum(c.alpe,x=>x.disp);
    c.dias=Math.max(c.seg&&(c.seg.atr||0)>0?c.seg.dias||0:0,c.dba&&(c.dba.atr||0)>0?c.dba.dias||0:0);
    c.atraso=!!((c.seg&&(c.seg.atr||0)>0)||(c.dba&&(c.dba.atr||0)>0));c.bloq=!!(c.dba&&c.dba.bloq);
    c.esgot=!!((c.alpe.length&&c.adisp<=0)||(c.am&&(c.am.lim||0)>1&&(c.am.disp||0)<=0)||(c.seg&&(c.seg.lim||0)>0&&(c.seg.pct||0)>=90)||(c.dba&&(c.dba.lim||0)>0&&(c.dba.pct||0)>=90));
    c.semseg=!c.seg||!(c.seg.lim>0);c.k=so(c.nome+" "+c.cnpj+" "+fmtDoc(c.cnpj)+" "+c.cid);return c})
   .sort((a,b)=>(b.atraso-a.atraso)||lt(b)-lt(a))}
const lt=c=>(c.seg?c.seg.lim||0:0)+c.alim+(c.am?c.am.lim||0:0)+(c.dba?c.dba.lim||0:0);

function lerArq(k,inp){const f=inp.files[0];inp.value="";if(!f)return;ENV[k]={lendo:1};render();const rd=new FileReader();
  rd.onload=async()=>{try{const L=lerPlanilha(k,new Uint8Array(rd.result));await pracas();ENV[k]={arq:f.name,partes:separar(k,L),aviso:IGN.length?"A aba "+IGN.join(", ")+" veio sem as colunas do modelo (CNPJ, limite, exposição) e ficou de fora: exporte de novo essa aba com todas as colunas.":""}}catch(er){ENV[k]={erro:er.message}}render()};rd.readAsArrayBuffer(f)}
/* Crédito DBA: cada planilha é de uma unidade (Grp. responsáveis DMB/DBE) — só essa base é substituída */
function unisEnv(k,e){return k=="dba"?UNIS.filter(u=>e.partes[u].length):UNIS}
async function enviar(k){const e=ENV[k];if(!e||!e.partes||e.env)return;e.env=1;e.pct=0;render();
  const T=800,versao=String(Date.now());let feito=0;const US=unisEnv(k,e);if(!US.length){ENV[k]={erro:"Planilha sem clientes com crédito."};render();return}const tot=US.reduce((a,u)=>a+Math.max(1,Math.ceil(e.partes[u].length/T)),0);
  try{for(const u of US){const L=e.partes[u],ch=k+"_"+u,n=Math.max(1,Math.ceil(L.length/T));
      for(let i=0;i<n;i++){const r=await rpc("salvarParte",ch,versao,i,n,L.slice(i*T,(i+1)*T),{arquivo:e.arq});
        if(!r||!r.ok)throw new Error((r&&r.erro)||"falha no envio");feito++;e.pct=Math.round(feito/tot*100);if(i==n-1)DADOS.metas[ch]=r.meta;render()}
      DADOS.bases[ch]=L}
    e.ok=1;e.env=0;status();render();setTimeout(()=>{if(ENV[k]===e){ENV[k]=null;render()}},6000)}
  catch(er){ENV[k]={erro:"Não publicou ("+er.message+"). Confira e envie de novo."};render()}}
function filtroBox(){return `<div class="busca"><input id="q" placeholder="Buscar cliente, CNPJ ou cidade" value="${esc(Q)}" oninput="Q=this.value;tabela()">

function vRanking(){
  const C=juntar(),G={};
  C.forEach(c=>{const v=DONOS[c.cnpj]||"Sem vendedor (fora da Base de Clientes)";const g=G[v]=G[v]||{v,n:0,al:0,ad:0,ml:0,md:0,sl:0,se:0,dl:0,de:0,atr:0,na:0};
    g.n++;g.al+=c.alim;g.ad+=c.adisp;if(c.am){g.ml+=c.am.lim||0;g.md+=c.am.disp||0}if(c.seg){g.sl+=c.seg.lim||0;g.se+=c.seg.exp||0;}if(c.dba){g.dl+=c.dba.lim||0;g.de+=c.dba.exp||0}const at=Math.max(c.seg?c.seg.atr||0:0,c.dba?c.dba.atr||0:0);if(at>0){g.atr+=at;g.na++}});
  const RK=Object.values(G).map(g=>Object.assign(g,{lim:g.al+g.ml+g.sl+g.dl,uso:(g.al-g.ad)+(g.ml-g.md)+g.se+g.de})).sort((a,b)=>(a.v.startsWith("Sem")-b.v.startsWith("Sem"))||b.lim-a.lim);
  const T=RK.reduce((t,g)=>{["n","al","ad","ml","md","sl","se","dl","de","atr","na","lim","uso"].forEach(k=>t[k]+=g[k]);return t},{n:0,al:0,ad:0,ml:0,md:0,sl:0,se:0,dl:0,de:0,atr:0,na:0,lim:0,uso:0});
  const pu=(u,l)=>l?P(u/l*100):"–",mx=Math.max(1,...RK.map(g=>g.lim));
  const sA=base("alpe"),sM=base("amcard"),sS=base("seguro"),sD=base("dba");
  const SG=[["ALPE",sum(sA,x=>x.lim),sum(sA,x=>x.lim)-sum(sA,x=>x.disp),sA.length,"#0b4a9a","limite atribuído − disponível"],["AMCARD",sum(sM,x=>x.lim),sum(sM,x=>x.tom),sM.length,"#1f9d55","tomado"],["Seguro Arcelor",sum(sS,x=>x.lim),sum(sS,x=>x.exp),sS.length,"#f26b1d","exposição"],["Crédito DBA (risco)",sum(sD,x=>x.lim),sum(sD,x=>x.exp),sD.length,"#7a47aa","exposição"]].sort((a,b)=>b[1]-a[1]);
  const mS=Math.max(1,...SG.map(x=>x[1]));
  let h=`<div class="box" style="margin-bottom:14px"><h2>Ranking por seguradora · ${UNOME[UNI]}</h2><div class="sub">Limite total concedido, quanto já está em uso e clientes com crédito em cada uma</div><div class="rol"><table><thead><tr><th>#</th><th>Seguradora</th><th class="n">Clientes</th><th class="n">Limite</th><th class="n">Em uso</th><th class="n">Disponível</th><th class="n">% uso</th><th style="width:30%"></th></tr></thead><tbody>
   ${SG.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x[0]}</b><span class="s">em uso = ${x[5]}</span></td><td class="n">${x[3].toLocaleString("pt-BR")}</td><td class="n"><b>${R(x[1])}</b></td><td class="n">${R(x[2])}</td><td class="n">${R(x[1]-x[2])}</td><td class="n">${pu(x[2],x[1])}</td><td><div class="barra"><i style="width:${x[1]/mS*100}%;background:${x[4]}"></i></div></td></tr>`).join("")}</tbody></table></div></div>`;
  h+=`<div class="box"><h2>Ranking de créditos por vendedor · ${UNOME[UNI]}</h2><div class="sub">Clientes da carteira de cada vendedor/dupla (Proprietário da conta na Base de Clientes) · ordenado pelo limite total</div><div class="rol"><table><thead>
   <tr><th rowspan="2">#</th><th rowspan="2">Vendedor / dupla</th><th rowspan="2" class="n">Clientes</th><th class="gh" colspan="2">ALPE</th><th class="gh" colspan="2">AMCARD</th><th class="gh" colspan="2">Seguro Arcelor</th><th class="gh" colspan="2">Crédito DBA</th><th class="gh" colspan="3">Total</th><th class="gh" colspan="2">Em atraso</th></tr>
   <tr><th class="n">Limite</th><th class="n">Disponível</th><th class="n">Limite</th><th class="n">Disponível</th><th class="n">Limite</th><th class="n">Exposição</th><th class="n">Limite</th><th class="n">Exposição</th><th class="n">Limite</th><th class="n">% uso</th><th style="min-width:90px"></th><th class="n">Valor</th><th class="n">Clientes</th></tr></thead><tbody>
   ${RK.map((g,i)=>`<tr ${g.v.startsWith("Sem")?'style="color:#667"':""}><td>${g.v.startsWith("Sem")?"":i+1}</td><td><b>${esc(g.v)}</b></td><td class="n">${g.n.toLocaleString("pt-BR")}</td><td class="n l">${R(g.al)}</td><td class="n">${R(g.ad)}</td><td class="n l">${R(g.ml)}</td><td class="n">${R(g.md)}</td><td class="n l">${R(g.sl)}</td><td class="n">${R(g.se)}</td><td class="n l">${R(g.dl)}</td><td class="n">${R(g.de)}</td><td class="n l"><b>${R(g.lim)}</b></td><td class="n">${pu(g.uso,g.lim)}</td><td><div class="barra"><i style="width:${g.lim/mx*100}%"></i></div></td><td class="n l">${g.atr?`<b style="color:var(--bad)">${R(g.atr)}</b>`:"–"}</td><td class="n">${g.na||"–"}</td></tr>`).join("")||`<tr><td colspan="16" class="vazio">Nenhum crédito publicado para ${UNOME[UNI]} ainda.</td></tr>`}
   <tr class="tot"><td></td><td>Total</td><td class="n">${T.n.toLocaleString("pt-BR")}</td><td class="n">${R(T.al)}</td><td class="n">${R(T.ad)}</td><td class="n">${R(T.ml)}</td><td class="n">${R(T.md)}</td><td class="n">${R(T.sl)}</td><td class="n">${R(T.se)}</td><td class="n">${R(T.dl)}</td><td class="n">${R(T.de)}</td><td class="n">${R(T.lim)}</td><td class="n">${pu(T.uso,T.lim)}</td><td></td><td class="n">${R(T.atr)}</td><td class="n">${T.na||"–"}</td></tr></tbody></table></div>
   <div class="nota">% uso = (ALPE usado + AMCARD tomado + exposição do Seguro + exposição do Crédito DBA) ÷ limite total. Em atraso: maior valor entre Seguro e Crédito DBA.</div></div>`;
  return h}
function render(){
  document.querySelectorAll("#abas button").forEach(b=>b.classList.toggle("on",b.dataset.k==ABA));
  const ed=CTX.modo=="editor";
  if(ABA=="ranking"){app.innerHTML=tit("Financeiro Comercial · "+UNOME[UNI],"Ranking de créditos","Por seguradora e por vendedor/dupla")+vRanking();altura();return}
  const sA=base("alpe"),sM=base("amcard"),sS=base("seguro"),sD=base("dba"),natr=sS.filter(x=>(x.atr||0)>0),datr=sD.filter(x=>(x.atr||0)>0);
  const nome=ABA=="resumo"?"Créditos dos Clientes":TIPOS.find(t=>t.k==ABA).n;
  let h=tit("Financeiro Comercial · DBA "+UNOME[UNI]+(CTX.modo=="vendedor"?" · minha carteira":""),nome,ABA=="resumo"?"ALPE, AMCARD, Seguro Arcelor e Crédito DBA por cliente: limite, disponível, exposição e atraso.":"Base "+nome+" de "+UNOME[UNI]+(meta(ABA)?" · atualizada em "+dt(meta(ABA).atualizado):" · ainda não enviada"));
  h+=`<div class="g g4">`+(ABA=="resumo"||ABA=="alpe"?kpi("ALPE · disponível",R(sum(sA,x=>x.disp)),`de ${R(sum(sA,x=>x.lim))} · ${sA.length} clientes`,"#0b4a9a"):"")
   +(ABA=="resumo"||ABA=="amcard"?kpi("AMCARD · disponível",R(sum(sM,x=>x.disp)),`de ${R(sum(sM,x=>x.lim))} · ${sM.length.toLocaleString("pt-BR")} clientes`,"#1f9d55"):"")
   +(ABA=="resumo"||ABA=="seguro"?kpi("Seguro · exposição",R(sum(sS,x=>x.exp)),`limite ${R(sum(sS,x=>x.lim))} · ${sS.length.toLocaleString("pt-BR")} clientes`,"#f26b1d")+kpi("Em atraso",R(sum(natr,x=>x.atr)),`${natr.length} clientes no Seguro`,"var(--bad)"):"")
   +(ABA=="resumo"||ABA=="dba"?kpi("Crédito DBA · exposição",R(sum(sD,x=>x.exp)),`limite ${R(sum(sD,x=>x.lim))} · ${sD.length.toLocaleString("pt-BR")} clientes`,"#7a47aa"):"")
   +(ABA=="dba"?kpi("DBA · em atraso",R(sum(datr,x=>x.atr)),`${datr.length} clientes · ${sD.filter(x=>x.bloq).length} bloqueados no SAP`,"var(--bad)"):"")+`</div>`;
  if(ed)h+=`<div class="box" style="margin-bottom:14px"><h2>Atualizar planilhas</h2><div class="sub">Envie a planilha inteira no modelo de sempre: a página separa os clientes pela cidade (praças do DBA Marabá e do DBA Belém; na ALPE vale a coluna Filial). Cidades fora das duas praças vão para "Outras praças". No Crédito DBA (risco), cada planilha é de uma unidade (Grp. responsáveis DMB = Marabá, DBE = Belém) e substitui só a base dela. Ao publicar, as bases anteriores são substituídas e os vendedores veem na hora.</div><div class="rol"><table><thead><tr><th>Crédito</th><th>Última atualização</th><th>Arquivo</th><th class="n">Clientes em ${UNOME[UNI]}</th><th></th></tr></thead><tbody>${TIPOS.filter(t=>!t.off&&(ABA=="resumo"||t.k==ABA)).map(blocoEnvio).join("")}</tbody></table></div></div>`;
  h+=`<div class="box">${filtroBox()}<div id="tb"></div></div>`;
  app.innerHTML=h;tabela()}
function baixar(){const H=["Cliente","CNPJ/CPF","Cidade","UF","ALPE limite","ALPE disponível","AMCARD limite","AMCARD disponível","AMCARD tomado","AMCARD últ. transação","Seguro classe","Seguro limite","Exposição","% esgotamento","Dias em atraso","Valor em atraso","DBA classe","DBA limite","DBA validade","DBA exposição","DBA % esgotamento","DBA a receber","DBA dias atraso","DBA valor atraso","DBA bloqueio"];
  const L=ROWS.map(c=>[titulo(c.nome),fmtDoc(c.cnpj),titulo(c.cid),c.uf,c.alpe.length?c.alim:"",c.alpe.length?c.adisp:"",c.am?c.am.lim:"",c.am?c.am.disp:"",c.am?c.am.tom:"",c.am?c.am.ult||"":"",c.seg?c.seg.cls||"":"",c.seg?c.seg.lim:"",c.seg?c.seg.exp:"",c.seg?c.seg.pct:"",c.seg?c.seg.dias:"",c.seg?c.seg.atr:"",...(c.dba?[c.dba.cls||"",c.dba.lim,c.dba.val||"",c.dba.exp,c.dba.pct,c.dba.cr,c.dba.dias,c.dba.atr,c.dba.bloq?"bloqueado":""]:["","","","","","","","",""])]);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([H,...L]),"Créditos");XLSX.writeFile(wb,"creditos-"+UNI+".xlsx")}
async function carregar(){
  stEl.innerHTML='<span class="dot"></span>atualizando…';
  try{const r=await rpc("lerCreditos");if(!r.ok)throw new Error(r.erro);CTX.modo=r.modo;DONOS=r.donos||{};DADOS={metas:r.metas||{},bases:r.bases||{}};
    if(r.uni){UNI=r.uni;setUni(UNI);document.querySelector(".uni").style.display="none"}
    LIDO=new Date();status();render()}
  catch(e){stEl.textContent="erro ao ler os créditos";app.innerHTML=`<div class="box vazio">${esc(e.message)}</div>`;altura()}}
setUni(UNI);parent.postMessage({tipo:"pronto"},"*");
</script>
