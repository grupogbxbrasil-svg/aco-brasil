<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Indicadores de Performance | AÇO BRASIL</title>
<link rel="stylesheet" href="../assets/css/site.css">
<style>
/* ============================================================
   ESPELHO DA PLANILHA "Performance Vendedores - Site"
   Cole abaixo o link CSV de "Arquivo > Compartilhar > Publicar na Web"
   (aba da dupla, formato CSV). O painel relê a planilha sozinho.
   ============================================================ */
:root{--fundo:#f4f6fa;--ok:#1f9d55;--mid:#e0a106;--bad:#e2483d}
body{background:var(--fundo)}
.cab{background:linear-gradient(90deg,#071d3c,#0b2a55);color:#fff;position:sticky;top:0;z-index:10}
.cab-in{max-width:1400px;margin:0 auto;min-height:64px;display:flex;align-items:center;gap:16px;padding:0 24px;flex-wrap:wrap}
.cab b{font-size:1.05rem}.cab small{opacity:.75;font-size:.8rem;display:block}
.cab .esp{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:.8rem}
.btn{border:1px solid #ffffff55;color:#fff;background:transparent;border-radius:16px;padding:6px 14px;font:inherit;font-size:.8rem;cursor:pointer;text-decoration:none}
.btn:hover{background:#ffffff1a}
.dot{width:8px;height:8px;border-radius:50%;background:#5bd16f;display:inline-block;margin-right:6px;box-shadow:0 0 0 3px #5bd16f33}
main{max-width:1400px;margin:0 auto;padding:22px 24px 50px}
.tit{border-left:4px solid var(--laranja);padding-left:18px;margin-bottom:20px}
.tit .sup{font-size:.74rem;letter-spacing:1.2px;font-weight:700;color:var(--cinza);text-transform:uppercase}
.tit h1{font-size:1.8rem;color:var(--marinho);line-height:1.2}
.tit p{color:var(--cinza);font-size:.85rem;max-width:900px}
.resumo2{display:grid;grid-template-columns:320px 1fr;gap:16px;margin-bottom:16px}
.box{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:18px}
.box h2{font-size:1rem;color:var(--marinho);margin-bottom:4px}
.box .sub{font-size:.78rem;color:var(--cinza);margin-bottom:14px}
.anel{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.anel svg{width:190px;height:190px}
.anel .lg{display:flex;gap:18px;margin-top:10px;font-size:.82rem;color:var(--cinza)}
.anel .lg b{display:block;font-size:1.15rem;color:var(--marinho)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:#fbfcfe;border:1px solid var(--borda);border-radius:10px;padding:14px}
.kpi small{font-size:.72rem;font-weight:700;letter-spacing:.6px;color:var(--cinza);text-transform:uppercase}
.kpi b{display:block;font-size:1.5rem;color:var(--marinho);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;font-size:.7rem;letter-spacing:.5px;text-transform:uppercase;color:var(--cinza);padding:8px 6px;border-bottom:2px solid var(--borda);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid #edf1f6;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:800;color:var(--marinho);border-top:2px solid var(--borda)}
.barra{height:8px;background:#edf1f6;border-radius:4px;min-width:90px;position:relative;overflow:hidden}
.barra i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-weight:700;font-size:.76rem}
.rol{overflow-x:auto}
.colunas{display:flex;align-items:flex-end;gap:10px;height:230px;padding-top:24px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.col .v{font-size:.72rem;font-weight:700;color:var(--marinho);margin-bottom:4px}
.col .b{width:100%;max-width:46px;background:linear-gradient(#0b4a9a,#0b2a55);border-radius:6px 6px 0 0;min-height:2px}
.col.ult .b{background:linear-gradient(#ff8a45,#f26b1d)}
.col .m{font-size:.72rem;color:var(--cinza);margin-top:6px;text-transform:capitalize}
.hb{display:grid;grid-template-columns:170px 1fr 60px;gap:10px;align-items:center;font-size:.82rem;margin-bottom:9px}
.hb .barra{height:12px}
.hb span:last-child{text-align:right;font-weight:700;color:var(--marinho)}
.aviso{background:#fff7e6;border:1px solid #f2c26b;border-radius:10px;padding:16px;color:#6b4a00;font-size:.9rem}
.aviso code{background:#fff;padding:2px 6px;border-radius:4px}
.obs{font-size:.76rem;color:var(--cinza);margin-top:10px;font-style:italic}
@media(max-width:1100px){.resumo2,.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){main,.cab-in{padding-left:16px;padding-right:16px}.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:1.2rem}.hb{grid-template-columns:110px 1fr 50px}.tit h1{font-size:1.4rem}}
</style>
</head>
<body>
<header class="cab"><div class="cab-in">
  <div><b id="dupla">Indicadores de Performance</b><small>Painel Comercial · espelho da planilha</small></div>
  <div class="esp"><span id="stEl"><span class="dot"></span>carregando…</span>
    <button class="btn" onclick="carregar()">Atualizar</button>
    <a class="btn" id="voltar" href="painel.html">← Painel</a></div>
</div></header>

<main id="app"><div class="box">Carregando dados da planilha…</div></main>

<script src="duplas.js"></script>
<script>
/* ---------- CONFIGURAÇÃO ---------- */
// Link "Publicar na Web" em CSV de cada dupla (aba RESULTADO <DUPLA>).
const PLANILHAS = {
  "israel-stefanny": "https://docs.google.com/spreadsheets/d/1ItMeQ0Z8T7TTeO3l2Iq1ZyOpiQy1buRX5ZBSzQ2g4ng/gviz/tq?tqx=out:csv&headers=0&gid=202609273"   // ex.: "https://docs.google.com/spreadsheets/d/e/2PACX-.../pub?gid=202609273&single=true&output=csv"
};
const ATUALIZA_MIN = 5;   // relê a planilha a cada 5 minutos

/* ---------- utilidades ---------- */
const id = new URLSearchParams(location.search).get("d") || "israel-stefanny";
const D = (typeof DUPLAS!=="undefined" && DUPLAS[id]) || null;
if (D) { dupla.textContent = "Indicadores de Performance · " + D.nomes.join(" & "); voltar.href = "painel.html?d=" + id; }

function csv(t){const L=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;else if(ch==','){r.push(c);c=""}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);L.push(r);r=[];c=""}else c+=ch}
  if(c||r.length){r.push(c);L.push(r)}return L.map(x=>x.map(s=>s.trim()))}
const num = s => { if(!s||s=="–"||s=="-")return 0; const neg=/^\(.*\)$/.test(s)||s.startsWith("-");
  const v=parseFloat(s.replace(/[R$%()\s+-]/g,"").replace(/\./g,"").replace(",","."))||0; return neg?-v:v; };
const esc = s => String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const cor = p => p>=100?"var(--ok)":p>=80?"var(--mid)":"var(--bad)";
const acha = (R,f,de=0) => { for(let i=de;i<R.length;i++) if(f(R[i]))return i; return -1; };
const bloco = (R,h,fim) => { const o=[]; for(let i=h+1;i<R.length;i++){const r=R[i]; if(!r[2]){if(o.length)break;else continue} o.push(r); if(fim(r[2]))break;} return o; };

/* ---------- leitura da planilha ---------- */
function ler(R){
  const S = {};
  const t = acha(R,r=>/RESULTADO DO M[ÊE]S/i.test(r[0]||"")); S.titulo = t>=0?R[t][0].replace(/^\d+\s*\|\s*/,""):"Resultado do mês"; S.nota = t>=0?(R[t+1]||[])[0]:"";
  const k1 = acha(R,r=>r[0]=="META (t)"), k2 = acha(R,r=>r[0]=="CLIENTES SÓ CARTEIRA");
  S.kpi = {};
  [k1,k2].forEach(k=>{ if(k<0)return; [0,3,6,9,12].forEach(c=>{ const L=k==k1?["META (t)","FATURADO (t)","% REALIZADO","CLIENTES C/ COMPRA","CLIENTES FAT + CARTEIRA"]:["CLIENTES SÓ CARTEIRA","TICKET MÉDIO (t)","PVL FATURADO (R$/t)","MARKUP %","RAG (R$/t)"]; S.kpi[L[c/3]] = (R[k+1]||[])[c]||"–"; }); });
  const hs = acha(R,r=>r[2]=="SETOR"); S.setor = hs<0?[]:bloco(R,hs,x=>/^TOTAL/.test(x));
  S.hSetor = hs<0?[]:R[hs];
  const hm = acha(R,r=>r[2]=="MÊS"); S.meses = hm<0?[]:bloco(R,hm,x=>/^ACUMULADO/.test(x)).filter(r=>!/^ACUMULADO/.test(r[2]));
  S.hMes = hm<0?[]:R[hm];
  const hr = acha(R,r=>r[2]=="ROTA"); S.rotas = hr<0?[]:bloco(R,hr,x=>/^TOTAL/.test(x)).filter(r=>!/^TOTAL/.test(r[2]));
  S.hRota = hr<0?[]:R[hr];
  const hc = acha(R,r=>r[2]=="CLIENTE"); S.cli = hc<0?[]:bloco(R,hc,x=>/^TOTAL/.test(x)).filter(r=>!/^TOTAL/.test(r[2]));
  S.hCli = hc<0?[]:R[hc];
  return S;
}

/* ---------- desenho ---------- */
function anel(p){const r=78,C=2*Math.PI*r,v=Math.max(0,Math.min(p,100));
  return `<svg viewBox="0 0 190 190"><circle cx="95" cy="95" r="${r}" fill="none" stroke="#edf1f6" stroke-width="16"/>
  <circle cx="95" cy="95" r="${r}" fill="none" stroke="${cor(p)}" stroke-width="16" stroke-linecap="round"
   stroke-dasharray="${C*v/100} ${C}" transform="rotate(-90 95 95)"/>
  <text x="95" y="96" text-anchor="middle" font-size="34" font-weight="800" fill="#0b2a55">${p.toFixed(1).replace(".",",")}%</text>
  <text x="95" y="120" text-anchor="middle" font-size="12" fill="#5b6675">da meta realizada</text></svg>`}

function desenhar(S){
  const K=S.kpi, pct=num(K["% REALIZADO"]);
  const kp=["FATURADO (t)","CLIENTES C/ COMPRA","CLIENTES FAT + CARTEIRA","CLIENTES SÓ CARTEIRA","TICKET MÉDIO (t)","PVL FATURADO (R$/t)","MARKUP %","RAG (R$/t)"]
    .map(k=>`<div class="kpi"><small>${esc(k)}</small><b>${esc(K[k]??"–")}</b></div>`).join("");

  const setRows=S.setor.map(r=>{const p=num(r[7]),tot=/^TOTAL/.test(r[2]);
    return `<tr class="${tot?"tot":""}"><td>${esc(r[2])}</td><td class="n">${esc(r[5])}</td><td class="n">${esc(r[6])}</td>
    <td>${r[7]?`<div class="barra"><i style="width:${Math.min(p,100)}%;background:${cor(p)}"></i></div>`:""}</td>
    <td class="n">${r[7]?`<span class="pill" style="background:${cor(p)}1f;color:${cor(p)}">${esc(r[7])}</span>`:"–"}</td>
    <td class="n">${esc(r[8])}</td><td class="n">${esc(r[12])}</td><td class="n">${esc(r[13])}</td><td class="n">${esc(r[14])}</td></tr>`}).join("");

  const tm=S.meses.map(r=>num(r[11])), mx=Math.max(1,...tm);
  const cols=S.meses.map((r,i)=>`<div class="col${i==S.meses.length-1?" ult":""}" title="${esc(r[2])}: ${esc(r[11])} t">
    <span class="v">${Math.round(tm[i])}</span><div class="b" style="height:${tm[i]/mx*100}%"></div>
    <span class="m">${esc(r[2].split(/[\/ ]/)[0].slice(0,3).toLowerCase())}</span></div>`).join("");

  const rt=S.rotas.map(r=>({n:r[2].replace(/^ROTA /,""),v:num(r[14]),s:r[13]})), rm=Math.max(1,...rt.map(x=>x.v));
  const rotas=rt.slice(0,10).map(x=>`<div class="hb"><span>${esc(x.n)}</span><div class="barra"><i style="width:${x.v/rm*100}%;background:#0b4a9a"></i></div><span>${Math.round(x.v)}</span></div>`).join("");

  const hc=S.hCli, cli=S.cli.map(r=>`<tr><td>${esc(r[1])}</td><td>${esc(r[2])}</td>${r.slice(6,13).map(v=>`<td class="n">${esc(v)}</td>`).join("")}<td class="n"><b>${esc(r[13])}</b></td><td class="n">${esc(r[14])}</td></tr>`).join("");

  app.innerHTML=`
  <div class="tit"><div class="sup">${esc(D?D.unidade:"Painel Comercial")}</div><h1>${esc(S.titulo)}</h1><p>${esc(S.nota)}</p></div>
  <div class="resumo2">
    <div class="box anel">${anel(pct)}<div class="lg"><div>Meta<b>${esc(K["META (t)"]??"–")} t</b></div><div>Faturado<b>${esc(K["FATURADO (t)"]??"–")} t</b></div></div></div>
    <div class="box"><h2>Indicadores do mês</h2><div class="sub">Consolidado da dupla</div><div class="kpis">${kp}</div></div>
  </div>
  <div class="box rol" style="margin-bottom:16px"><h2>Detalhamento por setor</h2><div class="sub">Verde ≥ 100% · amarelo ≥ 80% · vermelho &lt; 80%</div>
    <table><thead><tr><th>Setor</th><th class="n">Meta (t)</th><th class="n">Faturado (t)</th><th>Progresso</th><th class="n">% Realiz.</th><th class="n">Clientes</th><th class="n">PVL (R$/t)</th><th class="n">Markup</th><th class="n">RAG</th></tr></thead><tbody>${setRows}</tbody></table></div>
  <div class="grid2">
    <div class="box"><h2>Evolução mês a mês</h2><div class="sub">Volume faturado total (t)</div><div class="colunas">${cols}</div></div>
    <div class="box"><h2>Faturamento por rota</h2><div class="sub">Total acumulado no ano (t) · visão reportada</div>${rotas}</div>
  </div>
  <div class="box rol"><h2>Top 20 clientes</h2><div class="sub">Volume faturado (t) · visão orgânica (ex-BGL)</div>
    <table><thead><tr><th>Nº</th><th>Cliente</th>${hc.slice(6,13).map(h=>`<th class="n">${esc(h)}</th>`).join("")}<th class="n">Total (t)</th><th class="n">%</th></tr></thead><tbody>${cli}</tbody></table></div>`;
}

/* ---------- carga automática ---------- */
async function carregar(){
  const url=PLANILHAS[id];
  if(!url){app.innerHTML=`<div class="aviso"><b>Falta conectar a planilha.</b> Em <i>Arquivo › Compartilhar › Publicar na Web</i>, escolha a aba <b>RESULTADO ${esc(D?D.nomes.join(" X ").toUpperCase():"")}</b> e o formato <b>CSV</b>. Cole o link em <code>PLANILHAS</code> no topo do script deste arquivo.</div>`;stEl.textContent="sem planilha";return}
  try{
    stEl.innerHTML='<span class="dot"></span>atualizando…';
    const r=await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    desenhar(ler(csv(await r.text())));
    stEl.innerHTML='<span class="dot"></span>atualizado às '+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  }catch(e){stEl.textContent="erro ao ler planilha";if(!app.querySelector(".resumo2"))app.innerHTML=`<div class="aviso">Não foi possível ler a planilha (${esc(e.message)}). Confira se a aba continua publicada na Web.</div>`}
}
carregar(); setInterval(carregar, ATUALIZA_MIN*60*1000);
</script>
</body>
</html>
