<div id="gate"><form onsubmit="return entrarDir(event)"><h1>Painel da Diretoria</h1><p>Acesso restrito · DBA Marabá e Belém</p>
<label for="gu">Usuário</label><input id="gu" autocomplete="username" required>
<label for="gs">Senha</label><input id="gs" type="password" autocomplete="current-password" required>
<button type="submit">Entrar</button><div class="er" id="ger"></div></form></div>
<script>
/* Login simples da diretoria (só no navegador — não é segurança real). Para trocar a senha, gere o SHA-256 da nova e substitua abaixo. */
const DIR_USERS={"diretoria":"5df6b10b2a3358054b97e3bd42cc572e1e0244aeb2de0358379370c83d28e0b0","supervisao":"09be3223d2e141d52a73221eff0000bcede632177ca296489c349d3e8108e292"};
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function entrarDir(e){e.preventDefault();const u=gu.value.trim().toLowerCase();if(DIR_USERS[u]&&DIR_USERS[u]===await sha(gs.value)){try{sessionStorage.setItem("dir_ok","1")}catch(_){}gate.remove()}else ger.textContent="Usuário ou senha inválidos.";return false}
try{if(sessionStorage.getItem("dir_ok")==="1")gate.remove()}catch(_){}
</script>

<script>
/* ============================================================
   FONTES (atualizam sozinhas — o painel relê a cada 10 min)
   FAT: aba "FAT 2026 ATUAL" da planilha publicada do Painel Comercial
   BV : aba "BV" da planilha "Performance Vendedores - Site" (PVL, markup, RAG)
   ============================================================ */
/* ---------- UNIDADES (botão Marabá / Belém) ----------
   Cada unidade tem as mesmas 5 fontes. Para Belém, preencha os gid das abas
   equivalentes da planilha "Painel Comercial DBA Belém" (publicada na Web).
   Enquanto um gid estiver vazio, aquela fonte é ignorada (FAT vazio = painel avisa). */
const PUB_MAB="https://docs.google.com/spreadsheets/d/e/2PACX-1vRawbhvAjRq68EavM2MejbGZYjPLZDZ9-pmI3t56E3tgudNnnkcHGwYj6HAOFTZ0t-lfVBOQ1LGGK8H/pub?single=true&output=csv&gid=";
const PUB_BEL="https://docs.google.com/spreadsheets/d/e/2PACX-1vR48DjCVdLNMOQzoD-C_LGMecUY4Ypk2SNSxyc95hg5X9YRuGXIUbC9E5sQHu8DYvNM53jUShwU0PXA/pub?single=true&output=csv&gid=";
const GID_BEL={REP:"",ORG:"",FAT:"1363505846", NOVO:"", DP:"", BV:"1875147214", BI:"1366626833"}; // BV = aba "Base Vendedores" (Power BI por vendedor/setor) // FAT = aba "faturamento 2026" · BI = aba "INFORMAÇÃO BI"
const UNIDADES={
  maraba:{nome:"Marabá", fontes:null},
  belem:{nome:"Belém", duplas:{"Fabio":"Fabio / Marcelle","Marcelle":"Fabio / Marcelle","Alessandra":"Alessandra / Jessica","Jessica":"Alessandra / Jessica"}, fontes:Object.fromEntries(Object.entries(GID_BEL).map(([k,g])=>[k,g?PUB_BEL+g:""]))}
};
let UNI="maraba";
try{UNI=new URLSearchParams(location.search).get("u")||localStorage.getItem("dir_uni")||UNI}catch(_){}
if(!UNIDADES[UNI])UNI="maraba";
const FONTES = {
  FAT: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRawbhvAjRq68EavM2MejbGZYjPLZDZ9-pmI3t56E3tgudNnnkcHGwYj6HAOFTZ0t-lfVBOQ1LGGK8H/pub?single=true&output=csv&gid=1851262199",
  // NOVO: aba "FAT NOVO 2026" (layout novo, atualizada diariamente, sem o grupo BGL) — fonte principal das notas
  NOVO: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRawbhvAjRq68EavM2MejbGZYjPLZDZ9-pmI3t56E3tgudNnnkcHGwYj6HAOFTZ0t-lfVBOQ1LGGK8H/pub?single=true&output=csv&gid=910000001",
  // DP: aba "De-Para Fat Novo" — código da equipe → vendedor
  DP:   "https://docs.google.com/spreadsheets/d/e/2PACX-1vRawbhvAjRq68EavM2MejbGZYjPLZDZ9-pmI3t56E3tgudNnnkcHGwYj6HAOFTZ0t-lfVBOQ1LGGK8H/pub?single=true&output=csv&gid=910000002",
  BV:  "https://docs.google.com/spreadsheets/d/1ItMeQ0Z8T7TTeO3l2Iq1ZyOpiQy1buRX5ZBSzQ2g4ng/gviz/tq?tqx=out:csv&headers=0&gid=777001",
  // BI: aba "BI SITE" (IMPORTRANGE da aba INFORMAÇÃO BI de "Resultado BI - Marabá") — total da filial por setor, sempre atual
  BI:  PUB_MAB+"1735550437", // aba "INFORMAÇÃO BI" do Painel Comercial DBA Marabá (atualizada pela rotina com o Power BI)
  // Totais oficiais do mês (batem com o BI): Executive Review — Reported (com BGL) e — Organic (sem BGL)
  REP: PUB_MAB+"1005259843",
  ORG: PUB_MAB+"293735571"
};
UNIDADES.maraba.fontes={...FONTES};
function setUni(u){UNI=u;try{localStorage.setItem("dir_uni",u)}catch(_){}
  Object.assign(FONTES,UNIDADES[u].fontes);uniNome.textContent=UNIDADES[u].nome;document.title="Diretoria · DBA "+UNIDADES[u].nome;
  document.querySelectorAll(".uni .btn").forEach(b=>b.classList.toggle("on",b.dataset.u==u));
  abas.innerHTML=ABAS.map(([k,t])=>`<button data-k="${k}">${t}</button>`).join("");fMes.innerHTML="";fDupla.innerHTML="";D=[];app.innerHTML='<div class="carga"><div class="spin"></div>Lendo a base de '+UNIDADES[u].nome+'…</div>'}
document.querySelector(".uni").onclick=e=>{const b=e.target.closest("[data-u]");if(!b||b.dataset.u==UNI)return;setUni(b.dataset.u);carregar(true)};
// Colunas da aba FAT 2026 ATUAL (posição, começando em 0)
const C = {grp:13, vend:63, cli:49, nome:50, cid:52, data:100, dupla:229, ano:230, ton:231, rota:233, mes:234, fam:242, setor:246};
// Belém: a aba "faturamento 2026" tem 4 colunas a mais antes das colunas (aux)
const C_MAB={...C}, C_BEL={grp:13, vend:63, cli:49, nome:50, cid:52, data:100, dupla:233, ano:234, ton:235, rota:237, mes:238, fam:246, setor:250};
const colsUni=()=>Object.assign(C, UNI=="belem"?C_BEL:C_MAB);
const BGL = "GV484", CENTRO_VEGA = "9697";
const MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const ATUALIZA_MIN = 10;

/* ---------- utilidades ---------- */
function csv(t){const L=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=""}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);L.push(r);r=[];c=""}else c+=ch}if(c||r.length){r.push(c);L.push(r)}return L}
const num=s=>{if(s==null)return 0;s=String(s).trim();if(!s||s=="–"||s=="-")return 0;const neg=/^\(.*\)$/.test(s)||s.startsWith("-");const v=parseFloat(s.replace(/[R$%()\s+-]/g,"").replace(/\./g,"").replace(",","."))||0;return neg?-v:v};
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const f1=v=>v.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
const f0=v=>Math.round(v).toLocaleString("pt-BR");
const fp=v=>isFinite(v)?(v>0?"+":"")+v.toLocaleString("pt-BR",{maximumFractionDigits:1})+"%":"–";
const pct=(a,b)=>b?(a/b-1)*100:NaN;
const cls=v=>!isFinite(v)?"":v>=0?"up":"dn";
const nomeD=d=>d.replace(/\s*\/\s*/," & ");
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const grp=(a,k)=>{const o={};a.forEach(x=>{const kk=typeof k=="function"?k(x):x[k];(o[kk]=o[kk]||[]).push(x)});return o};
const titulo=s=>String(s||"").toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());

/* ---------- estado ---------- */
let D=[], BV=[], BIm={}, REPm={}, ORGm={}, FONTE_NF="", ULT_BGL=null, ABA="resumo", ULT=null;

/* ---------- cálculos ---------- */
function diasUteis(y,m,ate){let n=0;const fim=new Date(y,m,0).getDate();for(let d=1;d<=fim;d++){const dt=new Date(y,m-1,d);if(ate&&dt>ate)break;const w=dt.getDay();if(w&&w<6)n++}return n}
/* Total da dupla/vendedor no mês pelo Power BI (aba Base Vendedores); null se o BI não tem o mês */
function bvDu(DU,m){const v=BV.filter(x=>x.m==m&&(x.dupla==DU||x.vend==DU)&&!/total/i.test(x.setor||""));return v.length?sum(v,x=>x.t):null}
function ctx(){
  const M=+fMes.value, DU=fDupla.value, base=DU?D.filter(x=>x.dupla==DU):D;
  const porM=m=>base.filter(x=>x.m==m);
  const cur=porM(M), ant=porM(M-1);
  const parcial=ULT&&ULT.getMonth()+1==M&&ULT.getFullYear()==2026;
  const duT=diasUteis(2026,M), duD=parcial?Math.max(1,diasUteis(2026,M,ULT)):duT;
  let bi=null,duD2=duD;const hoje=new Date();
  let biM=DU?(()=>{const v=BV.filter(x=>x.m==M&&(x.dupla==DU||x.vend==DU)&&!/total/i.test(x.setor||""));if(!v.length)return null;const o={t:0,set:[]};v.forEach(x=>{o.t+=x.t;o.set.push([titulo(x.setor),x.t])});o.set.sort((a,b)=>b[1]-a[1]);return o})():BIm[M];
  /* Dupla/vendedor: o Power BI é a referência sempre que tiver o mês (antes só entrava quando passava as notas em 5%) */
  if(biM&&(DU?biM.t>0:biM.t>sum(cur,x=>x.t)*1.05)){bi=biM;if(hoje.getFullYear()==2026&&hoje.getMonth()+1==M){const ont=new Date(hoje);ont.setDate(hoje.getDate()-1);duD2=Math.max(1,diasUteis(2026,M,ont))}}
  const tm=m=>{if(DU){const t=bvDu(DU,m);if(t!=null)return t}return sum(base.filter(x=>x.m==m),x=>x.t)};
  return {M,DU,base,porM,cur,ant,parcial,duT,duD,bi,duDbi:duD2,parcialBi:duD2<duT,tm};
}
function serie(a,ate){const o=[];for(let m=1;m<=ate;m++)o.push(sum(a.filter(x=>x.m==m),x=>x.t));return o}
function clientes(a){const o={};a.forEach(x=>{const c=o[x.cli]=o[x.cli]||{cli:x.cli,nome:x.nome,cid:x.cid,dupla:x.dupla,rota:x.rota,t:0,ms:{},ult:null};c.t+=x.t;c.ms[x.m]=(c.ms[x.m]||0)+x.t;if(x.dt&&(!c.ult||x.dt>c.ult))c.ult=x.dt});return Object.values(o)}

/* ---------- componentes ---------- */
const kpi=(t,v,sub,c,sp)=>`<div class="kpi${sp?" ks":""}" style="--c:${c||"var(--azul2)"}"><small>${t}</small><b>${v}</b><span>${sub||""}</span>${sp?sparkA(sp,c||"#0b4a9a"):""}</div>`;
function colunas(ms,a,b,destaque){const mx=Math.max(1,...a.map((v,i)=>v+(b?b[i]:0)));
  return `<div class="cols">${ms.map((m,i)=>{const tot=a[i]+(b?b[i]:0);return `<div class="col" title="${MES[m-1]}: ${f1(tot)} t"><span class="v">${f0(tot)}</span><div class="st" style="height:${tot/mx*100}%">${b?`<i style="height:${tot?b[i]/tot*100:0}%;background:var(--bgl)"></i>`:""}<i style="flex:1;background:${m==destaque?"linear-gradient(#ff8a45,#f26b1d)":"linear-gradient(#0b4a9a,#0b2a55)"}"></i></div><span class="m">${MES[m-1]}</span></div>`}).join("")}</div>`}
function spark(v){if(!v.length)return"";const mx=Math.max(...v,1),w=90,h=26,st=w/Math.max(1,v.length-1);const p=v.map((y,i)=>`${(i*st).toFixed(1)},${(h-2-(y/mx)*(h-4)).toFixed(1)}`).join(" ");return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline points="${p}" fill="none" stroke="#0b4a9a" stroke-width="2"/><circle cx="${((v.length-1)*st).toFixed(1)}" cy="${(h-2-(v[v.length-1]/mx)*(h-4)).toFixed(1)}" r="3" fill="#f26b1d"/></svg>`}

const CORES=["#0b2a55","#f26b1d","#1f9d55","#0b4a9a","#7a47aa","#c8930d","#127c80","#e2483d"];
function sparkA(v,c){if(!v||v.length<2)return"";const mx=Math.max(...v,1),mn=Math.min(...v,0),w=200,h=40,st=w/(v.length-1),y=x=>(h-3-(x-mn)/((mx-mn)||1)*(h-8)).toFixed(1);const p=v.map((x,i)=>`${(i*st).toFixed(1)},${y(x)}`).join(" ");return `<svg class="kspark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polygon points="0,${h} ${p} ${w},${h}" fill="${c}" opacity=".12"/><polyline points="${p}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function donut(arr){const tot=sum(arr,x=>x[1])||1,R=62,C=2*Math.PI*R;let off=0;
  const seg=arr.map(([n,v],i)=>{const d=C*v/tot,el=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${CORES[i%8]}" stroke-width="22" stroke-dasharray="${d} ${C-d}" stroke-dashoffset="${-off}"><title>${esc(n)}: ${f1(v)} t</title></circle>`;off+=d;return el}).join("");
  return `<div class="donut"><svg viewBox="0 0 160 160"><g transform="rotate(-90 80 80)">${seg}</g><text x="80" y="78" text-anchor="middle" font-size="22" font-weight="800" fill="#0b2a55">${f0(tot)}</text><text x="80" y="96" text-anchor="middle" font-size="10" fill="#5b6675">toneladas</text></svg>
  <div class="dleg">${arr.map(([n,v],i)=>`<div><i style="background:${CORES[i%8]}"></i><span>${esc(n)}</span><b>${f1(v/tot*100)}%</b></div>`).join("")}</div></div>`}
function gauge(p){const v=Math.max(0,Math.min(p,150))/150,R=80,C=Math.PI*R,col=p>=100?"#5bd16f":p>=85?"#ffc24d":"#ff7b6b";

function heat(rows,ms){return `<div class="rol"><table class="heat"><thead><tr><th>Dupla</th>${ms.map(m=>`<th class="n">${MES[m-1]}</th>`).join("")}</tr></thead><tbody>${rows.map(([n,v])=>{const mx=Math.max(...v,1);return `<tr><td><b>${esc(n)}</b></td>${v.map(x=>{const a=x/mx;return `<td class="n" style="background:rgba(11,42,85,${(a*.85).toFixed(2)});color:${a>.5?"#fff":"#16202e"}">${f0(x)}</td>`}).join("")}</tr>`}).join("")}</tbody></table></div>`}

/* ---------- maiores clientes (tabela) ---------- */
function topCli(a,n,ext){const tot=sum(a,x=>x.t);const r=Object.entries(grp(a,"cli")).map(([c,b])=>{const t=sum(b,x=>x.t);const u=b[0];return{nome:titulo(u.nome||c),cid:u.cid,set:u.setor,dup:u.dupla,t,nf:b.length}}).sort((x,y)=>y.t-x.t).slice(0,n);

/* ---------- ABA: RANKING ---------- */
/* total oficial do vendedor/dupla no mês (quadro "vendas" = Power BI); se não houver, usa o valor das notas */
function offT(nome,m,v){try{const o=typeof offGet=="function"?offGet(nome,m):null;return o&&o.t>0?o.t:v}catch(_){return v}}
function linhaRank(nome,a,X,tot){
  const {M,parcial,duT,duD}=X;const c=sum(a.filter(x=>x.m==M),x=>x.t), p=offT(nome,M-1,sum(a.filter(x=>x.m==M-1),x=>x.t));
  const ofc=typeof offGet=="function"?offGet(nome,M):null; const c_=ofc?ofc.t:c;
  const pj=parcial?c_/duD*duT:c_; const s=serie(a,M).map((v,i)=>offT(nome,i+1,v)).slice(-6);s[s.length-1]=pj; const cl=ofc?ofc.cl:new Set(a.filter(x=>x.m==M).map(x=>x.cli)).size;
  const ytd=sum(a.filter(x=>x.m<=M),x=>x.t), med=[M-1,M-2,M-3].filter(m=>m>0).map(m=>offT(nome,m,sum(a.filter(x=>x.m==m),x=>x.t)));
  const md=med.length?sum(med,x=>x)/med.length:0;
  const ytd_=ytd-c+c_;return {nome,c:c_,p,pj,s,cl,ytd:ytd_,md,v:pct(pj,p),sh:tot?c_/tot*100:0,tk:cl?c_/cl:0};
}
function tabRank(rows,col1,tot){
  return `<div class="rol"><table><thead><tr><th>#</th><th>${col1}</th><th class="n">Mês (t)</th>${X_.parcial?'<th class="n">Projeção</th>':""}<th class="n">Mês ant.</th><th class="n">Var.</th><th class="n">Média 3m</th><th class="n">Share</th><th class="n">Clientes</th><th class="n">Ticket</th><th class="n">Acum. ano</th><th>Últimos 6 meses</th></tr></thead><tbody>
  ${rows.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.nome)}</b></td><td class="n"><b>${f1(r.c)}</b></td>${X_.parcial?`<td class="n">${f1(r.pj)}</td>`:""}<td class="n">${f1(r.p)}</td><td class="n"><span class="tag ${!isFinite(r.v)?"tg-c":r.v>=0?"tg-v":"tg-r"}">${fp(r.v)}</span></td><td class="n">${f1(r.md)}</td><td class="n">${f1(r.sh)}%</td><td class="n">${r.cl}</td><td class="n">${f1(r.tk)}</td><td class="n">${f0(r.ytd)}</td><td>${spark(r.s)}</td></tr>`).join("")}
  ${tot?`<tr class="tot"><td></td><td>Total</td><td class="n">${f1(sum(rows,r=>r.c))}</td>${X_.parcial?`<td class="n">${f1(sum(rows,r=>r.pj))}</td>`:""}<td class="n">${f1(sum(rows,r=>r.p))}</td><td class="n">${fp(pct(sum(rows,r=>r.pj),sum(rows,r=>r.p)))}</td><td class="n">${f1(sum(rows,r=>r.md))}</td><td class="n">100%</td><td class="n"></td><td class="n"></td><td class="n">${f0(sum(rows,r=>r.ytd))}</td><td></td></tr>`:""}
  </tbody></table></div>`;
}
let X_;
function vRanking(X){
  const {M,base}=X; let tot=sum(X.cur,x=>x.t);
  let rd=Object.entries(grp(base,"dupla")).map(([d,a])=>linhaRank(nomeD(d),a,X,tot));const totR=sum(rd,r=>r.c);if(totR>tot){tot=totR;rd=Object.entries(grp(base,"dupla")).map(([d,a])=>linhaRank(nomeD(d),a,X,tot))}rd.sort((a,b)=>b.c-a.c);
  const eq=base.filter(x=>x.dupla!="Outros");
  const rv=Object.entries(grp(eq,"vend")).map(([v,a])=>linhaRank(v||"(sem vendedor)",a,X,tot)).filter(r=>r.ytd>0.5).sort((a,b)=>b.c-a.c);

  return tit(`Ranking · ${MES[M-1]}/26`,"Quem está entregando",X.parcial?"Projeção = volume do mês ÷ dias úteis apurados × dias úteis do mês. Variação calculada pela projeção.":"")+
  `<div class="podio">${ordem.map(i=>{const r=pod[i];return `<div class="pd pd${i+1}"><div class="pd-n">${i+1}º</div><div class="pd-nome">${esc(r.nome)}</div><div class="pd-v">${f1(r.c)} t</div><div class="pd-s"><span class="tag ${!isFinite(r.v)?"tg-c":r.v>=0?"tg-v":"tg-r"}">${fp(r.v)}</span> · ${r.cl} clientes · ${f1(r.sh)}% do total</div><div class="pd-base" style="height:${[0,90,64,46][i+1]}px">${i+1}</div></div>`}).join("")}</div>
  <div class="g g3">${kpi(best&&best.v<0?"Menor queda":"Maior crescimento",esc(best?.nome||"–"),best?fp(best.v)+" vs mês anterior":"","#1f9d55")}${kpi("Vendedores ativos",rv.filter(r=>r.c>0).length,"com faturamento no mês","#1f57a3")}${kpi("Volume da equipe",f1(sum(rd.filter(r=>r.nome!="Outros"),r=>r.c))+" t",f1(tot?sum(rd.filter(r=>r.nome!="Outros"),r=>r.c)/tot*100:0)+"% da filial","#f26b1d")}</div>
  <div class="box" style="margin-bottom:14px"><h2>Duplas e individuais</h2><div class="sub">"Outros" = notas fora das duplas atuais</div>${tabRank(rd,"Dupla",true)}</div>

  <div class="box"><h2>Vendedores</h2><div class="sub">Equipe atual, pelo vendedor da nota</div>${tabRank(rv,"Vendedor",false)}</div>`;
}

/* ---------- ABA: CLIENTES ---------- */
function vClientes(X){
  const {M,base,cur}=X; const ms=[...Array(M).keys()].map(i=>i+1);
  const ativos=ms.map(m=>new Set(base.filter(x=>x.m==m).map(x=>x.cli)).size);
  const vistos=new Set(), novosM=[], perdM=[];
  ms.forEach(m=>{const s=new Set(base.filter(x=>x.m==m).map(x=>x.cli));let n=0;s.forEach(c=>{if(!vistos.has(c))n++});s.forEach(c=>vistos.add(c));novosM.push(m==1?0:n);
    const prev=new Set(base.filter(x=>x.m<m&&x.m>=m-3).map(x=>x.cli));let p=0;prev.forEach(c=>{if(!s.has(c))p++});perdM.push(m==1?0:p)});
  const all=clientes(base.filter(x=>x.m<=M)), hoje=ULT||new Date();
  const dias=c=>c.ult?Math.floor((hoje-c.ult)/864e5):999;
  const faixa=[["Até 30 dias",c=>dias(c)<=30,"tg-v"],["31–60 dias",c=>dias(c)>30&&dias(c)<=60,"tg-a"],["61–90 dias",c=>dias(c)>60&&dias(c)<=90,"tg-a"],["Mais de 90 dias",c=>dias(c)>90,"tg-r"]];
  const risco=all.filter(c=>dias(c)>45&&dias(c)<=150).sort((a,b)=>b.t-a.t).slice(0,25);
  const cm=clientes(cur).sort((a,b)=>b.t-a.t), tot=sum(cm,c=>c.t);
  const acc=n=>tot?sum(cm.slice(0,n),c=>c.t)/tot*100:0;
  const recup=clientes(cur).filter(c=>{const a=base.filter(x=>x.cli==c.cli&&x.m<M);if(!a.length)return false;const um=Math.max(...a.map(x=>x.m));return M-um>=3}).length;

/* ---------- ABA: MIX (ano inteiro, filtros de setor e BGL) ---------- */
let MXS="", MXB="todos", MXV="";
function vMix(X){
  const {M,base}=X; const ms=[]; for(let m=1;m<=M;m++)ms.push(m);
  const temBGL=base.some(x=>x.bgl);
  if(!temBGL)MXB="todos";
  const vends=Object.entries(grp(base.filter(x=>x.m<=M&&x.vend),"vend")).map(([v,a])=>[v,sum(a,x=>x.t)]).filter(x=>x[1]>=1).sort((a,b)=>a[0].localeCompare(b[0])).map(x=>x[0]);
  if(MXV&&!vends.includes(MXV))MXV="";
  const b0=base.filter(x=>x.m<=M&&(!MXV||x.vend==MXV)&&(MXB=="todos"||(MXB=="com"?x.bgl:!x.bgl)));
  const sets=[...new Set(b0.map(x=>x.setor).concat(Object.values(BIm).flatMap(o=>(o.sd||[]).map(x=>x.s))).map(x=>String(x||"").toUpperCase().trim()))].filter(Boolean).sort();
  if(MXS&&!sets.includes(MXS))MXS="";
  const bs=MXS?b0.filter(x=>String(x.setor||"").toUpperCase().trim()==MXS):b0;
  const porMes=a=>ms.map(m=>sum(a.filter(x=>x.m==m),x=>x.t));
  /* Setores: total oficial do BI por setor (aba INFORMAÇÃO BI). Se o BI do mês não fecha com o total oficial (Executive Review), usa as notas ajustadas ao total oficial. */
  const U=x=>String(x||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
  const bglNF=m=>sum(base.filter(x=>x.m==m&&x.bgl),x=>x.t);
  const bglOf=m=>!X.DU&&REPm[m]&&ORGm[m]?Math.max(0,REPm[m]-ORGm[m]):bglNF(m);
  const ofSet=m=>{const rep=REPm[m],bi=BIm[m];let rows;
    if(X.DU&&!MXV&&MXB!="com"){const v=BV.filter(x=>x.m==m&&(x.dupla==X.DU||x.vend==X.DU)&&!/total/i.test(x.setor||""));if(v.length)return Object.entries(grp(v,"setor")).map(([s_,a])=>({s:U(s_),t:sum(a,x=>x.t)}))}
    if(MXV||X.DU)return Object.entries(grp(b0.filter(x=>x.m==m),"setor")).map(([s_,a])=>({s:U(s_),t:sum(a,x=>x.t)}));
    if(bi&&bi.sd&&bi.t&&(!rep||Math.abs(bi.t-rep)/rep<0.03))rows=bi.sd.map(x=>({s:U(x.s),t:x.t}));
    else{const nt=base.filter(x=>x.m==m);const tn=sum(nt,x=>x.t);const k=rep&&tn?rep/tn:1;rows=Object.entries(grp(nt,"setor")).map(([s_,a])=>({s:U(s_),t:sum(a,x=>x.t)*k}))}
    const pl=rows.find(x=>/PLANOS/.test(x.s))||(rows.push({s:"PLANOS E DERIVADOS",t:0}),rows[rows.length-1]);const bg=bglOf(m);
    if(MXB=="sem")pl.t=Math.max(0,pl.t-bg);else if(MXB=="com")rows=[{s:pl.s,t:bg}];
    return rows};
  const DISP={};base.forEach(x=>{const k=U(x.setor);if(!DISP[k]||/[ÇÃÁÉÍÓÚ]/i.test(x.setor))DISP[k]=String(x.setor).toUpperCase()});
  const OF=ms.map(m=>ofSet(m));
  const setNomes=[...new Set(OF.flat().map(x=>x.s))];
  const tabS=setNomes.filter(s_=>!MXS||U(MXS)==s_).map(s_=>{const v=OF.map(r=>sum(r.filter(x=>x.s==s_),x=>x.t));return{s:s_,v,t:sum(v,x=>x)}}).filter(r=>r.t>0.05).sort((x,y)=>y.t-x.t);
  const totV=ms.map((m,i)=>sum(tabS,r=>r.v[i])), totAno=sum(totV,x=>x);
  /* Rotas: notas fiscais; a diferença para o total oficial entra numa linha de ajuste, para fechar com o BI */
  const rotas=Object.entries(grp(bs,"rota")).map(([r,a])=>{const v=porMes(a);return{r,v,t:sum(v,x=>x),cl:new Set(a.map(x=>x.cli)).size}}).sort((x,y)=>y.t-x.t);
  const nfV=porMes(bs), adj=ms.map((m,i)=>totV[i]-nfV[i]);
  if(!MXV&&adj.some(x=>Math.abs(x)>0.5))rotas.push({r:"Ajuste ao BI (não detalhado nas notas)",v:adj,t:sum(adj,x=>x),cl:0,aj:1});
  const fam=Object.entries(grp(bs,"fam")).map(([f,a])=>[f||"(sem família)",sum(a,x=>x.t)]).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const cid=Object.entries(grp(bs,"cid")).map(([f,a])=>[f,sum(a,x=>x.t)]).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const fora=sum(bs.filter(x=>/fora/i.test(x.rota)),x=>x.t), totNF=sum(bs,x=>x.t);
  const st='style="font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--borda);margin-right:8px"';
  const filtros=`<div class="box" style="margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center"><b>Filtros</b>
   <label>Setor <select ${st} onchange="MXS=this.value;render()"><option value="">Todos os setores</option>${sets.map(s=>`<option value="${esc(s)}" ${s==MXS?"selected":""}>${esc(titulo(s))}</option>`).join("")}</select></label>
   <label>Vendedor <select ${st} onchange="MXV=this.value;render()"><option value="">Todos os vendedores</option>${vends.map(v=>`<option value="${esc(v)}" ${v==MXV?"selected":""}>${esc(v)}</option>`).join("")}</select></label>
   ${temBGL?`<label>BGL <select ${st} onchange="MXB=this.value;render()"><option value="todos" ${MXB=="todos"?"selected":""}>Com e sem BGL</option><option value="sem" ${MXB=="sem"?"selected":""}>Sem BGL</option><option value="com" ${MXB=="com"?"selected":""}>Só BGL (Galvolume)</option></select></label>`:""}</div>`;
  const rotB=MXB=="sem"?" · sem BGL":MXB=="com"?" · só BGL":"";
  const mesTh=ms.map(m=>`<th class="n">${MES[m-1]}</th>`).join("");
  const pf=typeof __PF=="function"?__PF():1;
  const tag=(c,p)=>{c=c*pf;return `<span class="tag ${!isFinite(pct(c,p))?"tg-c":pct(c,p)>=0?"tg-v":"tg-r"}">${fp(pct(c,p))}</span>`};
  return tit(`Setores & rotas · Jan–${MES[M-1]}/26`,"Onde está o volume no ano"+(MXV?" · "+MXV:"")+(MXS?" · "+titulo(MXS):"")+rotB,"")+filtros+
  `<div class="g g4">${kpi("Volume no ano",f0(totAno)+" t",`média de ${f1(totAno/Math.max(1,M))} t/mês`,"var(--laranja)")}${kpi(MXS?"Setor":"Setor líder no ano",titulo(MXS||DISP[tabS[0]?.s]||tabS[0]?.s||"–"),f0(tabS[0]?.t||0)+" t no ano")}${kpi("Rotas prioritárias",f1(totNF?(totNF-fora)/totNF*100:0)+"%",`Rota Fora DBA: ${f0(fora)} t no ano`,"#2e7d57")}${kpi("Cidades atendidas",new Set(bs.map(x=>x.cid)).size,"no ano","#7a47aa")}</div>
  <div class="box" style="margin-bottom:14px"><h2>Setores — ano inteiro</h2><div class="sub">Volume (t) por mês · ${MXV?"notas fiscais de "+esc(MXV):X.DU?"Power BI da dupla":"total oficial do BI"}${MXB!="todos"?" · BGL = Galvolume faturado pela VEGA":""}</div><div class="rol"><table><thead><tr><th>Setor</th>${mesTh}<th class="n">Ano</th><th class="n">% ano</th><th class="n">${pf!=1?"Var. (proj.)":"Var. mês"}</th><th>Tendência</th></tr></thead><tbody>
   ${tabS.map(r=>`<tr><td><b>${esc(titulo(DISP[r.s]||r.s))}</b></td>${r.v.map((x,i)=>`<td class="n" ${i==r.v.length-1?'style="font-weight:800;color:var(--marinho)"':""}>${f1(x)}</td>`).join("")}<td class="n"><b>${f0(r.t)}</b></td><td class="n">${f1(totAno?r.t/totAno*100:0)}%</td><td class="n">${tag(r.v[M-1],r.v[M-2])}</td><td>${spark(r.v)}</td></tr>`).join("")||`<tr><td colspan="${M+5}" class="vazio">Sem volume com esses filtros</td></tr>`}
   <tr class="tot"><td>Total</td>${totV.map(x=>`<td class="n">${f1(x)}</td>`).join("")}<td class="n">${f0(totAno)}</td><td class="n">100%</td><td class="n">${tag(totV[M-1],totV[M-2])}</td><td></td></tr></tbody></table></div>${X.parcial?`<div class="nota">${MES[M-1]} ainda parcial (${X.duD} de ${X.duT} dias úteis).</div>`:""}</div>
  <div class="box" style="margin-bottom:14px"><h2>Rotas — ano inteiro</h2><div class="sub">Volume (t) por mês pelas notas fiscais, clientes no ano e tendência · o total fecha com o BI</div><div class="rol"><table><thead><tr><th>Rota</th>${mesTh}<th class="n">Ano</th><th class="n">Clientes</th><th class="n">${pf!=1?"Var. (proj.)":"Var. mês"}</th><th>Tendência</th></tr></thead><tbody>
   ${rotas.map(r=>`<tr ${r.aj?'style="color:#667;font-style:italic"':""}><td><b>${esc(r.r)}</b></td>${r.v.map((x,i)=>`<td class="n" ${i==r.v.length-1?'style="font-weight:800;color:var(--marinho)"':""}>${f1(x)}</td>`).join("")}<td class="n"><b>${f0(r.t)}</b></td><td class="n">${r.aj?"–":r.cl}</td><td class="n">${r.aj?"":tag(r.v[M-1],r.v[M-2])}</td><td>${r.aj?"":spark(r.v)}</td></tr>`).join("")}
   <tr class="tot"><td>Total</td>${totV.map(x=>`<td class="n">${f1(x)}</td>`).join("")}<td class="n">${f0(totAno)}</td><td class="n">${new Set(bs.map(x=>x.cli)).size}</td><td></td><td></td></tr></tbody></table></div></div>
  <div class="box" style="margin-bottom:14px"><h2>Maiores clientes ${MXS?"· "+esc(titulo(MXS)):"por setor"}</h2><div class="sub">Volume no ano (t)${MXS?" · top 15 do setor":" · top 5 de cada setor (use o filtro de setor para ver mais)"}</div>
   ${MXS?topCli(bs,15):tabS.map(r=>`<h3 style="margin:14px 0 6px;color:var(--marinho)">${esc(titulo(DISP[r.s]||r.s))} <span style="font-weight:400;color:#667">· ${f0(r.t)} t</span></h3>${topCli(bs.filter(x=>U(x.setor)==r.s),5)}`).join("")}</div>
  <div class="g g2"><div class="box"><h2>Top famílias de produto</h2><div class="sub">t no ano</div>${hbars(fam)}</div><div class="box"><h2>Top cidades</h2><div class="sub">t no ano</div>${hbars(cid)}</div></div>`;

/* ---------- ABA: MARGEM ---------- */
function vMargem(X){
  const {M}=X;
  if(!BV.length)return tit("Margem & preço","Sem dados de margem","")+`<div class="box vazio">A aba BV da planilha "Performance Vendedores - Site" não respondeu. Confira se ela continua compartilhada por link.</div>`;
  const ms=[...new Set(BV.map(x=>x.m))].sort((a,b)=>a-b); const mm=ms.includes(M)?M:ms[ms.length-1];
  let b=BV.filter(x=>x.m==mm); const dsel=X.DU?X.DU.split("/").map(s=>s.trim().toLowerCase()):null;
  if(dsel)b=b.filter(x=>dsel.some(n=>x.vend.toLowerCase().includes(n.split(" ")[0])));
  const ag=a=>{const t=sum(a,x=>x.t),r=sum(a,x=>x.rec);return{t,pvl:t?sum(a,x=>x.pvl*x.t)/t:0,rag:t?sum(a,x=>x.rag*x.t)/t:0,mk:r?sum(a,x=>x.mk*x.rec)/r:0,rec:r}};
  let tot=ag(b);
  /* Visão geral (sem filtro de dupla): totais da filial direto da aba RESULTADO/INFORMAÇÃO BI */
  const biG=!X.DU&&BIm[mm]&&BIm[mm].t?BIm[mm]:null;
  if(biG)tot={t:biG.t,pvl:biG.pvl,rag:biG.rag,mk:biG.mkp,rec:biG.rec};
  const pv=Object.entries(grp(b,"vend")).map(([v,a])=>({v,...ag(a)})).sort((x,y)=>y.rag*y.t-x.rag*x.t);
  const ps=(biG&&biG.sd?biG.sd.map(x=>({s:x.s,t:x.t,pvl:x.pvl,mk:x.mk,rag:x.rag,rec:x.rec})):Object.entries(grp(b,"setor")).map(([s,a])=>({s,...ag(a)}))).sort((x,y)=>y.t-x.t);
  const ev=ms.map(m=>(!dsel&&BIm[m]&&BIm[m].t)?{m,t:BIm[m].t,rag:BIm[m].rag,pvl:BIm[m].pvl,mk:BIm[m].mkp,rec:BIm[m].rec}:({m,...ag(BV.filter(x=>x.m==m&&(!dsel||dsel.some(n=>x.vend.toLowerCase().includes(n.split(" ")[0])))))}));
  const mxr=Math.max(1,...ev.map(e=>e.rag));
  /* Rankings do ano (jan até o mês escolhido), por vendedor: RAG (R$/t, ponderado pelo volume) e toneladas vendidas */
  const by=BV.filter(x=>x.m<=mm&&!/total/i.test(x.setor||"")&&(!dsel||dsel.some(n=>x.vend.toLowerCase().includes(n.split(" ")[0]))));
  const pa=Object.entries(grp(by,"vend")).map(([v,a])=>({v,...ag(a)})).filter(p=>p.t>0);
  const MIN_T=10, rkR=pa.filter(p=>p.t>=MIN_T).sort((a,b)=>b.rag-a.rag), rkT=pa.slice().sort((a,b)=>b.t-a.t);
  const mxR=Math.max(1,...rkR.map(p=>p.rag)), mxT=Math.max(1,...rkT.map(p=>p.t)), md=i=>i<3?["🥇","🥈","🥉"][i]:(i+1)+"º";
  const rk=(arr,val,mx,cor,lab)=>`<div class="rol"><table><thead><tr><th>#</th><th>Vendedor</th><th>${lab}</th><th class="n"></th></tr></thead><tbody>${arr.map((p,i)=>`<tr><td>${md(i)}</td><td><b>${esc(p.v)}</b></td><td style="width:45%"><div class="barra"><i style="width:${Math.max(0,val(p))/mx*100}%;background:${cor}"></i></div></td><td class="n"><b>${lab=="RAG (R$/t)"?"R$ "+f0(p.rag):f0(p.t)+" t"}</b><br><small style="color:var(--cinza)">${lab=="RAG (R$/t)"?f0(p.t)+" t no ano":"RAG R$ "+f0(p.rag)+"/t"}</small></td></tr>`).join("")||'<tr><td colspan="4" class="vazio">Sem dados no ano</td></tr>'}</tbody></table></div>`;
  const rankings=`<div class="g g2"><div class="box"><h2>Ranking por RAG · jan–${MES[mm-1]}/26</h2><div class="sub">Resultado por tonelada no ano, ponderado pelo volume · só vendedores com ${MIN_T} t ou mais</div>${rk(rkR,p=>p.rag,mxR,"#1f57a3","RAG (R$/t)")}</div>
   <div class="box"><h2>Ranking por toneladas · jan–${MES[mm-1]}/26</h2><div class="sub">Volume vendido no ano por vendedor</div>${rk(rkT,p=>p.t,mxT,"var(--laranja)","Toneladas")}</div></div>`;
  return tit(`Margem & preço · ${MES[mm-1]}/26`,"Estamos vendendo bem ou só vendendo muito?",`Fonte: Power BI · ${biG?"totais da filial pela aba RESULTADO BI; por vendedor pela base de vendedores":"base de vendedores"} · PVL e RAG ponderados pelo volume, markup pela receita${mm!=M?` · último mês disponível: ${MES[mm-1]}`:""}`)+
  `<div class="g g4">${kpi("PVL médio","R$ "+f0(tot.pvl)+"/t","preço líquido de venda","var(--laranja)")}${kpi("Markup",f1(tot.mk)+"%","ponderado pela receita","#2e7d57")}${kpi("RAG médio","R$ "+f0(tot.rag)+"/t","resultado por tonelada","#1f57a3")}${kpi("Resultado (RAG × t)","R$ "+f0(tot.rag*tot.t),`${f1(tot.t)} t · receita R$ ${f0(tot.rec)}`,"#c8930d")}</div>
  <div class="g g21"><div class="box"><h2>Por vendedor</h2><div class="sub">Ordenado pela contribuição (RAG × volume)</div><div class="rol"><table><thead><tr><th>Vendedor</th><th class="n">Volume (t)</th><th class="n">PVL (R$/t)</th><th class="n">vs média</th><th class="n">Markup</th><th class="n">RAG (R$/t)</th><th class="n">Contribuição</th></tr></thead><tbody>
   ${pv.map(p=>`<tr><td><b>${esc(p.v)}</b></td><td class="n">${f1(p.t)}</td><td class="n">${f0(p.pvl)}</td><td class="n"><span class="tag ${p.pvl>=tot.pvl?"tg-v":"tg-r"}">${fp(pct(p.pvl,tot.pvl))}</span></td><td class="n">${f1(p.mk)}%</td><td class="n">${f0(p.rag)}</td><td class="n"><b>R$ ${f0(p.rag*p.t)}</b></td></tr>`).join("")}</tbody></table></div></div>
  <div class="box"><h2>RAG mês a mês</h2><div class="sub">R$/t</div><div class="cols">${ev.map(e=>`<div class="col"><span class="v">${f0(e.rag)}</span><div class="st" style="height:${e.rag/mxr*100}%"><i style="flex:1;background:${e.m==mm?"linear-gradient(#ff8a45,#f26b1d)":"linear-gradient(#0b4a9a,#0b2a55)"}"></i></div><span class="m">${MES[e.m-1]}</span></div>`).join("")}</div></div></div>
  ${rankings}
  <div class="box"><h2>Por setor</h2><div class="sub">Preço e margem</div><div class="rol"><table><thead><tr><th>Setor</th><th class="n">Volume (t)</th><th class="n">PVL (R$/t)</th><th class="n">Markup</th><th class="n">RAG (R$/t)</th><th>RAG relativo</th></tr></thead><tbody>
   ${ps.map(p=>`<tr><td><b>${esc(titulo(p.s))}</b></td><td class="n">${f1(p.t)}</td><td class="n">${f0(p.pvl)}</td><td class="n">${f1(p.mk)}%</td><td class="n">${f0(p.rag)}</td><td><div class="barra"><i style="width:${p.rag/Math.max(...ps.map(x=>x.rag),1)*100}%"></i></div></td></tr>`).join("")}</tbody></table></div></div>`;
}

/* ---------- render ---------- */
function semDuplasTxt(){if(!UNIDADES[UNI].semDuplas||ABA=="base")return;
  const tr=t=>t.replace(/Ficha da dupla/g,"Ficha do vendedor").replace(/Todas as duplas/g,"Todos os vendedores").replace(/Duplas e individuais/g,"Vendedores").replace(/\bDuplas\b/g,"Vendedores").replace(/\bduplas\b/g,"vendedores").replace(/\bDupla\b/g,"Vendedor").replace(/\bdupla\b/g,"vendedor");
