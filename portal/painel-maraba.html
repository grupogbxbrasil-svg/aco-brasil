<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Vendedor – Marabá</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#14181f;--muted:#5f6773;--line:#e4e7ec;--brand:#e8541c;--dark:#1d232b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--dark);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:4px solid var(--brand)}
header b{font-size:18px}header small{opacity:.7}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:14px}
.btn.ghost{background:transparent;border:1px solid #ffffff55}
main{max-width:1180px;margin:0 auto;padding:24px 16px}
/* login */
#login{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:380px}
.box h1{font-size:20px;margin:0 0 4px}.box p{color:var(--muted);margin:0 0 20px;font-size:14px}
label{font-size:13px;font-weight:600;display:block;margin:12px 0 6px}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:15px}
.erro{color:#c0392b;font-size:13px;min-height:18px;margin-top:10px}
.aviso{font-size:12px;color:var(--muted);margin-top:14px;background:#fff6e5;border:1px solid #f3d9a4;padding:8px;border-radius:8px}
/* painel */
.topo{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.topo h1{margin:0;font-size:22px}.topo span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;display:flex;gap:14px;position:relative;text-decoration:none;color:inherit;transition:box-shadow .15s}
.card:hover{box-shadow:0 6px 18px #0000000f}
.ic{flex:0 0 44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#fff}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:0 0 4px;font-size:15px}.card p{margin:0 0 10px;font-size:13px;color:var(--muted);line-height:1.4}
.abrir{color:var(--brand);font-weight:600;font-size:13px}
.off{opacity:.55;pointer-events:none}.off .ic{background:#c8ccd2!important}
.off .abrir{color:var(--muted)}
.badge{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;letter-spacing:.5px;background:#eef0f3;color:var(--muted);padding:3px 8px;border-radius:6px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <div><b>Aço Brasil · Portal do Vendedor</b><br><small>Distribuidor ArcelorMittal · Unidade Marabá</small></div>
  <div id="usr" class="hide"><span id="nome" style="margin-right:12px"></span><button class="btn ghost" onclick="sair()">Sair</button></div>
</header>

<section id="login">
  <form class="box" onsubmit="entrar(event)">
    <h1>Primeiro acesso</h1>
    <p>Dupla Marabá – Israel &amp; Stefanny</p>
    <label for="u">Usuário</label><input id="u" autocomplete="username" required>
    <label for="s">Senha</label><input id="s" type="password" autocomplete="current-password" required>
    <button class="btn" style="width:100%;margin-top:18px">Entrar</button>
    <div class="erro" id="erro"></div>
    <div class="aviso">Ambiente de teste. Login simulado no navegador, não é seguro para dados reais.</div>
  </form>
</section>

<main id="painel" class="hide">
  <div class="topo"><h1>Painel da Dupla · Marabá</h1><span>Israel &amp; Stefanny</span></div>
  <div class="grid" id="grid"></div>
</main>
<footer>Aço Brasil · Distribuidor ArcelorMittal</footer>

<script>
// USUÁRIOS DE TESTE: substituir por autenticação real (Supabase/Firebase) antes de produção
const USERS={israel:{senha:"teste123",nome:"Israel"},stefanny:{senha:"teste123",nome:"Stefanny"}};

const I={
 chart:'<path d="M4 18 9 12l4 3 7-8"/>',
 target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
 shield:'<path d="M12 3 5 6v6c0 4 3 7 7 9 4-2 7-5 7-9V6z"/><path d="m9 12 2 2 4-4"/>',
 userx:'<circle cx="9" cy="8" r="4"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M17 8l4 4M21 8l-4 4"/>',
 funnel:'<path d="M3 4h18l-7 8v6l-4 2v-8z"/>',
 doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M9 12h6M9 16h6M9 8h3"/>',
 coin:'<circle cx="12" cy="12" r="9"/><path d="M15 9c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2.2 0 3 6 1.5 6 4.6 0 1.4-1.3 2.2-3 2.2-1.5 0-2.6-.6-3-1.6M12 6v12"/>'
};
const CARDS=[
 ["Indicadores de Performance","Meta, faturado, % realizado e detalhamento por setor.","chart","#e8541c"],
 ["Radar Metodologia","Cobertura, contatos, cotações e conversão da dupla.","target","#2e7d52"],
 ["Radar de Crédito","Limite, risco e atraso da carteira DBA Marabá.","shield","#1f5fa8"],
 ["Churn de Clientes","Clientes em risco de perda e sem compra no mês.","userx","#c0392b"],
 ["Funil de Vendas","Funil reverso: etapas, volumes e conversão.","funnel","#7b45a8"],
 ["Pedidos - Israel","Carteira de pedidos do vendedor.","doc","#127c80"],
 ["Pedidos - Stefanny","Carteira de pedidos do vendedor.","chart","#127c80"],
 ["Carteira - Israel","Ordens em aberto na usina por status.","chart","#8a5a2b"],
 ["Carteira - Stefanny","Ordens em aberto na usina por status.","chart","#8a5a2b"],
 ["Pedido de Abastecimento Esporádico — Acompanhamento","Propostas de abastecimento dos vendedores: material, descrição, quantidade e vendedor. Situação automática pelo cruzamento com a base de transferência.","chart","#999",1],
 ["Faturamento","Últimos 12 meses de faturamento com filtros por vendedor, grupo, rota, cidade, cliente, usina, mês e ano.","chart","#999",1],
 ["Comissão","Apuração da comissão do mês.","coin","#b8860b"]
];
document.getElementById("grid").innerHTML=CARDS.map(([t,d,ic,c,off])=>`
 <a class="card${off?' off':''}" href="#">
  ${off?'<span class="badge">INDISPONÍVEL</span>':''}
  <div class="ic" style="background:${c}"><svg viewBox="0 0 24 24">${I[ic]}</svg></div>
  <div><h3>${t}</h3><p>${d}</p><span class="abrir">${off?'Em preparação':'Abrir →'}</span></div>
 </a>`).join("");

function mostrar(u){
 const ok=!!u;
 login.classList.toggle("hide",ok);painel.classList.toggle("hide",!ok);usr.classList.toggle("hide",!ok);
 if(ok)nome.textContent="Olá, "+USERS[u].nome;
}
function entrar(e){
 e.preventDefault();
 const k=u.value.trim().toLowerCase(),x=USERS[k];
 if(x&&x.senha===s.value){try{sessionStorage.setItem("vend",k)}catch(_){}erro.textContent="";mostrar(k)}
 else erro.textContent="Usuário ou senha inválidos.";
}
function sair(){try{sessionStorage.removeItem("vend")}catch(_){}s.value="";mostrar(null)}
let cur=null;try{cur=sessionStorage.getItem("vend")}catch(_){}
mostrar(USERS[cur]?cur:null);
</script>
</body>
</html>
