<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel da Dupla | AÇO BRASIL</title>
<link rel="stylesheet" href="../assets/css/site.css">
<style>
body{background:#f4f6fa;margin:0}
.hide{display:none!important}
/* ---- login (mesmo visual de portal/login.html) ---- */
#login{background:linear-gradient(135deg,#071d3c,#0b2a55);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:12px;max-width:420px;width:100%;padding:32px 28px;box-shadow:0 20px 50px #0006}
.box img{height:40px;margin-bottom:18px}
.box h1{font-size:1.4rem;color:var(--marinho)}
.box p{color:var(--cinza);font-size:.9rem;margin:8px 0 18px}
.aviso{background:#fff7e6;border:1px solid #f2c26b;border-radius:8px;padding:12px 14px;font-size:.85rem;color:#6b4a00}
.box label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 4px}
.box input{width:100%;padding:11px 12px;border:1px solid var(--borda);border-radius:8px;font:inherit;background:#f6f8fb}
.box button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:var(--marinho);color:#fff;font-weight:700;font-size:.95rem;cursor:pointer}
.box button:hover{background:var(--azul)}
.erro{color:#c0392b;font-size:.85rem;min-height:18px;margin-top:10px}
.voltar{display:block;text-align:center;margin-top:16px;font-size:.85rem}
/* ---- painel (igual ao Wix) ---- */
.marcas{background:#262a36;height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
.marcas img{height:44px;filter:brightness(0) invert(1);opacity:.92}
.marcas span{color:#e9ebef;font-weight:600;letter-spacing:.5px}
.m-aco{font-size:15px;line-height:1;text-align:center;font-weight:800}
.m-aperam{font-size:38px;font-weight:300!important;letter-spacing:-1px!important}
.m-belgo{font-size:40px;font-weight:700;line-height:.9;text-align:center}.m-belgo small{display:block;font-size:14px;font-weight:400;letter-spacing:1px}
.hero{background:linear-gradient(100deg,#0e2036 0%,#17304d 70%,#3a3430 100%);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px}
.av{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,#f26b1d,#e8541c);display:grid;place-items:center;font-weight:800;font-size:15px}
.hero .sup{font-size:12px;letter-spacing:1.5px;font-weight:700;color:#aab6c6;text-transform:uppercase}
.hero h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:28px;margin:2px 0}
.hero small{color:#c4ccd7;font-size:13px}
.hero .unid{margin-left:auto;border:1px solid #ffffff55;border-radius:20px;padding:7px 14px;color:#fff;text-decoration:none;font-weight:600;font-size:14px;background:#ffffff10;cursor:pointer}
.sair{margin-left:8px;background:transparent;border:1px solid #ffffff55;color:#fff;border-radius:20px;padding:7px 14px;cursor:pointer;font:inherit;font-size:13px}
main{padding:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:1240px;margin:0 auto}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.marcas{padding:0 12px}.marcas img{height:28px}.m-aperam{font-size:24px}.m-belgo{font-size:24px}.hero{flex-wrap:wrap}.hero .unid{margin-left:0}}
.card{background:#fff;border:1px solid #e3e7ee;border-radius:14px;padding:16px;display:flex;gap:14px;position:relative;text-decoration:none;color:#14181f;transition:box-shadow .15s}
.card:hover{box-shadow:0 6px 18px #0000000f}
.ic{flex:0 0 42px;height:42px;border-radius:10px;display:grid;place-items:center;color:#fff}
.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:0 0 4px;font-size:14px;font-weight:700}.card p{margin:0 0 8px;font-size:12.5px;color:#5b6675;line-height:1.4}
.abrir{color:#e8541c;font-weight:600;font-size:13px}
.off{pointer-events:none;background:#f8f9fb}.off h3,.off p,.off .abrir{color:#9aa1ab}.off .ic{background:#c9cdd3!important}
.badge{position:absolute;top:10px;right:12px;font-size:10px;font-weight:700;letter-spacing:.5px;background:#eceff3;color:#9aa1ab;padding:3px 8px;border-radius:6px}
</style>
</head>
<body>

<section id="login">
  <form class="box" onsubmit="entrar(event)">
    <img src="../logo-arcelormittal.png" alt="ArcelorMittal">
    <h1>Acesso Restrito</h1>
    <p><span id="lsub"></span></p>
    <div class="aviso" role="status"><b>Ambiente de teste.</b> Login simulado no navegador, sem dados reais.</div>
    <label for="u">Usuário</label><input id="u" autocomplete="username" required>
    <label for="s">Senha</label><input id="s" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <div class="erro" id="erro"></div>
    <a class="voltar" href="../index.html">← Voltar ao site</a>
  </form>
</section>

<div id="painel" class="hide">
  <div class="marcas">
    <span class="m-aco">AÇO<br>BRASIL</span>
    <img src="../logo-arcelormittal.png" alt="ArcelorMittal">
    <span class="m-aperam">aperam</span>
    <span class="m-belgo">belgo<small>arames</small></span>
  </div>
  <div class="hero">
    <div class="av" id="ini"></div>
    <div><div class="sup" id="sup"></div><h1 id="tit"></h1><small>Selecione um relatório</small></div>
    <a class="unid" id="unid" href="login.html"></a><button class="sair" onclick="sair()">Sair</button>
  </div>
  <main><div class="grid" id="grid"></div></main>
</div>

<script src="duplas.js"></script>
<script>
const I={
 chart:'<path d="M4 18 9 12l4 3 7-8"/>',
 target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
 shield:'<path d="M12 3 5 6v6c0 4 3 7 7 9 4-2 7-5 7-9V6z"/><path d="m9 12 2 2 4-4"/>',
 userx:'<circle cx="9" cy="8" r="4"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M17 8l4 4M21 8l-4 4"/>',
 funnel:'<path d="M3 4h18l-7 8v6l-4 2v-8z"/>',
 doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M9 12h6M9 16h6M9 8h3"/>',
 coin:'<circle cx="12" cy="12" r="9"/><path d="M15 9c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2.2 0 3 6 1.5 6 4.6 0 1.4-1.3 2.2-3 2.2-1.5 0-2.6-.6-3-1.6M12 6v12"/>'
};
const id=new URLSearchParams(location.search).get("d")||"";
const D=DUPLAS[id];
if(!D){location.replace("login.html")}
else{
 const nome=D.nomes.join(" & "),f=x=>x.replace(/\{A\}/g,D.nomes[0]).replace(/\{B\}/g,D.nomes[1]).replace(/\{U\}/g,D.unidade);
 document.title=nome+" | AÇO BRASIL";
 lsub.textContent="Painel de Gestão Comercial · "+D.unidade+" — "+nome;
 ini.textContent=D.iniciais;sup.textContent="Painel de Gestão Comercial · "+D.unidade;tit.textContent=nome;unid.textContent="◀ "+D.unidade;
 grid.innerHTML=RELATORIOS.map(r=>`<a class="card${r.off?' off':''}" href="${r.link?r.link+'?d='+id:'#'}">${r.off?'<span class="badge">INDISPONÍVEL</span>':''}<div class="ic" style="background:${r.c||''}"><svg viewBox="0 0 24 24">${I[r.ic]}</svg></div><div><h3>${f(r.t)}</h3><p>${f(r.d)}</p><span class="abrir">${r.off?'Em preparação':'Abrir →'}</span></div></a>`).join("");
}
const K="vend_"+id;
function mostrar(ok){login.classList.toggle("hide",ok);painel.classList.toggle("hide",!ok)}
function entrar(e){e.preventDefault();const k=u.value.trim().toLowerCase();
 if(D&&D.usuarios[k]===s.value){try{sessionStorage.setItem(K,k)}catch(_){}erro.textContent="";mostrar(true)}
 else erro.textContent="Usuário ou senha inválidos."}
function sair(){try{sessionStorage.removeItem(K)}catch(_){}s.value="";mostrar(false)}
let c=null;try{c=sessionStorage.getItem(K)}catch(_){}mostrar(!!(D&&D.usuarios[c]));
</script>
</body>
</html>
